# Presetbook, au plus simple : une image publique, un volume, rien à construire.
#
#   docker compose up -d
#
# Pour partir des sources plutôt que de l'image publiée, décommenter « build »
# et lancer « docker compose up -d --build ».

services:
  presetbook:
    image: ghcr.io/fuzzinvaders/presetbook:latest
    # build: .
    container_name: presetbook
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # Compte de démonstration public : "identifiant:motdepasse", vide = désactivé.
      DEMO_LOGIN: "${DEMO_LOGIN:-}"
      # Décommenter pour exiger un identifiant sur tout le site (sauf /healthz).
      # La valeur se met dans un fichier .env à côté, jamais ici.
      # BASIC_AUTH: "${BASIC_AUTH:?renseigne BASIC_AUTH dans .env}"
    volumes:
      - presetbook-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  presetbook-data:
