<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Presetbook">
  <title>Presetbook</title>
  <!-- Un bouton d'ampli en aplat : la signature de l'application, lisible à 32 px.
       Le cadran tient dans le cercle de sécurité des icônes masquables (80 %),
       donc la même image sert pour « any » et pour « maskable ».
       Copyright (C) 2026 fuzzinvaders — SPDX-License-Identifier: AGPL-3.0-or-later -->
  <rect width="512" height="512" rx="104" fill="#1D1F1E"/>
  <circle cx="256" cy="256" r="150" fill="#F2EDDB"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#0C0E0D" stroke-width="10" stroke-opacity=".55"/>
  <!-- Le repère, à 14 h : la position qu'on lit le plus souvent sur une fiche. -->
  <g transform="rotate(60 256 256)">
    <rect x="243" y="122" width="26" height="86" rx="13" fill="#17150F"/>
  </g>
  <!-- Deux crans, pour dire que le bouton est gradué sans encombrer. -->
  <circle cx="136" cy="376" r="13" fill="#9E5F19"/>
  <circle cx="376" cy="376" r="13" fill="#9E5F19"/>
</svg>
