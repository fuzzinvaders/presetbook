document.getElementById("veil").addEventListener("input", function(e){
  var t = e.target;

  if (gdraft){
    var gf = t.getAttribute("data-gf");
    if (gf){
      gdraft[gf] = (gf === "perRow" && t.value === "") ? undefined : t.value;
      if (gf === "face" || gf === "color" || gf === "style" || gf === "perRow") refreshGearForm();
      return;
    }

    if (t.hasAttribute("data-gmodes")){
      if (t.checked){
        gdraft.modes = gdraft.modes || {options:["actif","passif"], off:{}};
      } else {
        delete gdraft.modes;
      }
      refreshGearForm();
      return;
    }
    var gm = t.getAttribute("data-gmode");
    if (gm !== null && gdraft.modes){
      var was = gdraft.modes.options[1];
      gdraft.modes.options[Number(gm)] = t.value;
      if (gm === "1" && gdraft.modes.off && gdraft.modes.off[was]){
        gdraft.modes.off[t.value] = gdraft.modes.off[was];
        delete gdraft.modes.off[was];
      }
      return;
    }
    var gc = t.getAttribute("data-gc");
    if (gc){
      var idx = parseInt(t.closest("[data-ci]").getAttribute("data-ci"), 10);
      var c = gdraft.controls[idx];
      if (gc === "l"){
        c.l = t.value;
        if (String(c.k).indexOf("c.") === 0){   /* clé encore automatique : elle suit le libellé */                     
          var others = gdraft.controls.filter(function(x, i){ return i !== idx; }).map(function(x){ return x.k; });
          c.k = slugKey(t.value, others);
        }
      } else if (gc === "t"){
        c.t = t.value;
        if (c.t === "scale"){ if (c.min === undefined) { c.min = 1; c.max = 10; c.step = 0.5; c.d = 5.5; } }
        if (c.t === "clock" && c.d === undefined) c.d = 0;
        if (c.t === "balance"){ c.a = c.a || "1"; c.b = c.b || "2"; if (c.d === undefined) c.d = 50; }
        refreshGearForm();
      } else if (gc === "needs"){
        if (t.value) c.needs = t.value; else delete c.needs;
      } else if (gc === "a" || gc === "b"){
        c[gc] = t.value;
      } else {
        c[gc] = t.value === "" ? undefined : parseFloat(t.value);
      }
      return;
    }
    if (t.hasAttribute("data-goff") && gdraft.modes){
      var ci2 = parseInt(t.closest("[data-ci]").getAttribute("data-ci"), 10);
      var key = gdraft.controls[ci2].k, mode = gdraft.modes.options[1];
      gdraft.modes.off = gdraft.modes.off || {};
      var list = gdraft.modes.off[mode] || [];
      if (t.checked){ if (list.indexOf(key) < 0) list.push(key); }
      else list = list.filter(function(x){ return x !== key; });
      gdraft.modes.off[mode] = list;
      return;
    }
    return;
  }

  if (!draft) return;
  var f = t.getAttribute("data-f");
  if (f){
    if (f === "tags") draft.tags = t.value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    else setPath(draft, f, t.value);
    if (f === "name" || f === "song.title") renderSuggest(f);
    return;
  }
  var sel = t.getAttribute("data-sel");
  if (sel){ setPath(draft, sel, t.value); return; }
  var key = t.getAttribute("data-sl");
  if (key){
    var v = parseFloat(t.value);
    setPath(draft, key, v);
    var out = document.querySelector('[data-out="' + key + '"]');
    if (out){
      var c = findCtrl(draft, key);
      out.textContent = c ? ctrlText(c, v) : String(v).replace(".", ",");
    }
    return;
  }
  if (t.hasAttribute("data-gear")){            /* changer de matériel : la façade suit */
    draft.gear = t.value;
    applyGearDefaults(draft);
    refreshBody();
    return;
  }
  if (draft.kind === "board"){
    var bs = t.getAttribute("data-bs");
    if (bs){
      var bi = parseInt(t.closest("[data-si]").getAttribute("data-si"), 10);
      var slot = draft.slots[bi];
      if (bs === "on") slot.on = t.checked;
      else if (bs === "gear"){ slot.gear = t.value; slot.v = {}; refreshBody(); }
      else slot[bs] = t.value;
      return;
    }
    var bv = t.getAttribute("data-bv");
    if (bv){
      var bi2 = parseInt(t.closest("[data-si]").getAttribute("data-si"), 10);
      var slot2 = draft.slots[bi2];
      var val = parseFloat(t.value);
      slot2.v = slot2.v || {};
      slot2.v[bv] = val;
      var g2 = allGear()[slot2.gear];
      var c2 = null, q;
      if (g2) for (q=0;q<g2.controls.length;q++) if (g2.controls[q].k === bv) c2 = g2.controls[q];
      var o2 = document.querySelector('[data-out="b' + bi2 + '-' + bv + '"]');
      if (o2 && c2) o2.textContent = ctrlText(c2, val);
      return;
    }
  }

  function slotIndex(el){ return parseInt(el.closest("[data-i]").getAttribute("data-i"), 10); }

  var sp = t.getAttribute("data-sp");                       /* paramètre d'un plugin */
  if (sp){
    var sl = draft.chain[slotIndex(t)];
    sl.p = sl.p || {};
    if (t.type === "checkbox") sl.p[sp] = t.checked;
    else if (t.tagName === "SELECT") sl.p[sp] = t.value;
    else sl.p[sp] = t.value === "" ? null : parseFloat(t.value);
    return;
  }
  var band = t.getAttribute("data-sb");                     /* bande de ReaEQ */
  if (band){
    var bi = parseInt(t.closest("[data-bi]").getAttribute("data-bi"), 10);
    var b = draft.chain[slotIndex(t)].bands[bi];
    b[band] = (band === "t") ? t.value : (t.value === "" ? null : parseFloat(t.value));
    return;
  }
  if (t.hasAttribute("data-son")){                          /* en circuit / hors circuit */
    draft.chain[slotIndex(t)].on = t.checked;
    return;
  }
  var s = t.getAttribute("data-s");
  if (s){
    var si = slotIndex(t);
    if (s === "plugin"){                                    /* changer de plugin change les champs */
      draft.chain[si].plugin = t.value;
      draft.chain[si].p = {};
      if (pluginDef(t.value).bands && !draft.chain[si].bands) draft.chain[si].bands = [];
      refreshBody();
      return;
    }
    draft.chain[si][s] = t.value;
  }
});
