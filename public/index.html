<meta charset="utf-8">
<!-- Sans cette ligne, un téléphone rend la page dans une fenêtre virtuelle de
     980 px puis réduit le tout : lisible à la loupe seulement. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Un lien d'invitation porte son jeton dans l'URL : on ne l'envoie à personne. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Presetbook : les réglages d'un instrument, d'un ampli, d'une pédale, d'un pédalier et des chaînes de plugins, affichés comme sur le matériel.">
<meta name="theme-color" content="#E4E4E0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presetbook">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<style>
:root{
  --bg:#E4E4E0; --panel:#F7F7F5; --panel-2:#ECECE8; --sunk:#1D1F1E; --sunk-ink:#E8EAE6; --sunk-line:#3C4340;
  --ink:#181917; --ink-2:#52564F; --ink-3:#84887F; --line:#CCCCC6; --line-2:#B6B6AF;
  --bass:#9E5F19; --bass-soft:#F1E3CF; --amp:#A62F26; --amp-soft:#F4DEDA; --reaper:#22654F; --reaper-soft:#D6E7E0;
  --pedal:#7A4FA8; --pedal-soft:#E8DEF3; --board:#1F6470; --board-soft:#D6E8EB;
  --ok:#1F6B45; --warn:#8A5A11; --danger:#A62F26;
  --shadow:0 1px 0 rgba(24,25,23,.05),0 8px 20px -14px rgba(24,25,23,.4);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121412; --panel:#1C1E1C; --panel-2:#242724; --sunk:#0C0E0D; --sunk-ink:#DFE2DE; --sunk-line:#333935;
    --ink:#ECEEE9; --ink-2:#A8ADA3; --ink-3:#7C8178; --line:#2C302C; --line-2:#3C413B;
    --bass:#D79A4F; --bass-soft:#33260F; --amp:#E0705F; --amp-soft:#391B16; --reaper:#5FB893; --reaper-soft:#122C24;
    --pedal:#BE9AE0; --pedal-soft:#2A1E38; --board:#6FBAC6; --board-soft:#10292E;
    --ok:#67B98C; --warn:#D4A055; --danger:#E0705F;
    --shadow:0 1px 0 rgba(0,0,0,.5),0 10px 24px -16px #000;
  }
}
:root[data-theme="dark"]{
  --bg:#121412; --panel:#1C1E1C; --panel-2:#242724; --sunk:#0C0E0D; --sunk-ink:#DFE2DE; --sunk-line:#333935;
  --ink:#ECEEE9; --ink-2:#A8ADA3; --ink-3:#7C8178; --line:#2C302C; --line-2:#3C413B;
  --bass:#D79A4F; --bass-soft:#33260F; --amp:#E0705F; --amp-soft:#391B16; --reaper:#5FB893; --reaper-soft:#122C24;
  --pedal:#BE9AE0; --pedal-soft:#2A1E38; --board:#6FBAC6; --board-soft:#10292E;
  --ok:#67B98C; --warn:#D4A055; --danger:#E0705F;
  --shadow:0 1px 0 rgba(0,0,0,.5),0 10px 24px -16px #000;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;
}
/* Aucune marge sous le pied de page : elle le décollerait du bas de l ecran
   des que le bas du conteneur entre dans la vue. */
.wrap{
  max-width:1240px; margin:0 auto;
  padding:clamp(16px,3vw,32px) clamp(14px,3vw,28px) 0;
  padding-left:max(clamp(14px,3vw,28px), env(safe-area-inset-left));
  padding-right:max(clamp(14px,3vw,28px), env(safe-area-inset-right));
}
body{overflow-wrap:break-word}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif; margin:0; text-wrap:balance}
h1{font-size:clamp(26px,4vw,38px); font-weight:700; letter-spacing:-.015em; text-transform:uppercase; line-height:1}
h2{font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:.06em}
h3{font-size:17px; font-weight:700; line-height:1.15}
p{margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-3)}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:3px}

/* ---- chrome ---- */
.top{display:flex; flex-wrap:wrap; align-items:flex-end; gap:14px 18px; padding-bottom:16px; border-bottom:3px solid var(--ink)}
.top .ttl{display:flex; flex-direction:column; gap:5px; margin-right:auto}
.acts{display:flex; flex-wrap:wrap; gap:8px}
/* ---- filtres ---- */
.filters{
  display:flex; flex-direction:column; gap:12px;
  margin-top:10px; padding:12px 14px;
  background:var(--panel); border:1px solid var(--line); border-radius:4px;
}
.filters[hidden]{display:none}
.facet{display:flex; flex-direction:column; gap:7px; align-items:flex-start}
.facet h3{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); margin:0;
}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.cmp{width:100%; border-collapse:collapse; font-size:13px; margin-top:6px}
.cmp th, .cmp td{padding:5px 8px; text-align:left; border-bottom:1px solid var(--line)}
.cmp thead th{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-3);
}
.cmp tbody th{font-weight:500; color:var(--ink-2); width:34%}
.cmp td{font-variant-numeric:tabular-nums}
/* L'écart se voit à la ligne entière : chercher la différence colonne par
   colonne est exactement le travail qu'on veut éviter à l'œil. */
.cmp tr.d{background:var(--panel-2)}
.cmp tr.d td{font-weight:600; color:var(--ink)}
.ulist{display:flex; flex-direction:column; gap:4px; width:100%}
.urow{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.uname{font-weight:600}
.urow .spacer{margin-left:auto}
.chip{
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--line-2); background:var(--panel-2); color:var(--ink-2);
  padding:4px 9px; border-radius:12px; font-size:12.5px; transition:background .12s ease;
}
.chip:hover{background:var(--line)}
.chip .n{
  font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.chip[aria-pressed="true"] .n{color:var(--bg); opacity:.7}
#btn-filters.on{border-color:var(--ink); color:var(--ink); font-weight:600}
.printhead{display:none}

.foot{
  position:sticky; bottom:0; z-index:5;    /* toujours visible, sans quitter la colonne de contenu */
  margin-top:34px; padding:10px 0;
  border-top:1px solid var(--line); background:var(--bg);
  display:flex; flex-wrap:wrap; gap:4px 14px; align-items:baseline;
  font-size:12.5px; color:var(--ink-3);
}
/* Le bouton flottant du tiers occupe le coin bas-gauche : 195 x 50 px à 16 px
   des bords. On lui laisse la place à côté du texte, et en dessous quand la
   fenêtre est trop étroite pour les mettre côte à côte. */
.foot.kofi{padding-left:227px}
@media (max-width:800px){
  .foot.kofi{padding-left:0; padding-bottom:76px}
}
.foot a{color:var(--ink-2); text-decoration:none; border-bottom:1px solid var(--line-2)}
.foot a:hover{color:var(--ink); border-bottom-color:var(--ink)}
.foot .lic{font-weight:600}
.foot .sep{color:var(--line-2)}
button{font-family:inherit; font-size:13.5px; cursor:pointer}
.btn{
  border:1px solid var(--line-2); background:var(--panel); color:var(--ink);
  padding:7px 13px; border-radius:3px; font-weight:500; transition:background .13s ease;
}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger); border-color:var(--danger)}
.btn.small{padding:4px 9px; font-size:12px}
.btn[disabled]{opacity:.45; cursor:not-allowed}

.store{
  display:inline-flex; align-items:center; gap:7px; font-family:"IBM Plex Mono",monospace; font-size:11px;
  letter-spacing:.04em; color:var(--ink-2); border:1px solid var(--line); background:var(--panel);
  padding:5px 10px; border-radius:3px;
}
.dot{width:7px; height:7px; border-radius:50%; background:var(--ink-3); flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--danger)}

/* ---- toolbar ---- */
.bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:18px 0 6px}
.tabs{display:flex; flex-wrap:wrap; gap:4px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:3px}
.tab{border:0; background:transparent; color:var(--ink-2); padding:6px 12px; border-radius:2px; font-size:13px; font-weight:600}
.tab[aria-selected="true"]{background:var(--panel); color:var(--ink); box-shadow:var(--shadow)}
.tab .n{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); margin-left:5px}
input[type="text"],input[type="search"],input[type="number"],input[type="password"],textarea,select{
  font-family:inherit; font-size:14px; color:var(--ink); background:var(--panel);
  border:1px solid var(--line-2); border-radius:3px; padding:7px 10px;
}
input[type="search"]{min-width:190px; flex:1 1 190px; max-width:320px}
textarea{width:100%; resize:vertical; line-height:1.5}
label.fld{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace; letter-spacing:.07em; text-transform:uppercase}
label.fld input,label.fld textarea,label.fld select{font-family:"IBM Plex Sans",sans-serif; font-size:14px; letter-spacing:0; text-transform:none; color:var(--ink)}

/* ---- knobs, aplats, façades respectées ---- */
.knob{
  --a:0deg; --face:#1D1814; --ptr:#F2BE72; --edge:rgba(255,255,255,.18);
  position:relative; width:38px; height:38px; border-radius:50%; flex:none;
  background:var(--face); box-shadow:0 0 0 1px var(--edge);
}
.knob i{position:absolute; inset:0; transform:rotate(var(--a))}
.knob i::before{
  content:""; position:absolute; left:50%; top:4px; width:3px; height:13px;
  margin-left:-1.5px; background:var(--ptr); border-radius:2px;
}
.knob.off{opacity:.45; --ptr:#9C9188}
.knob.amp{--face:#F2EDDB; --ptr:#17150F; --edge:rgba(0,0,0,.55)}
.knob.amp.dr{--ptr:#7C1F14}
/* Boutons blancs à repère bleu, la signature visuelle du Lionheart. */
.knob.laney{--face:#F8F8F5; --ptr:#1B49B4; --edge:rgba(0,0,0,.42)}
.knob.laney.dr{--ptr:#A8321F}
.knob.lg{width:52px; height:52px}
.knob.lg i::before{top:6px; height:18px; width:3.5px; margin-left:-1.75px}

.dial{display:flex; flex-direction:column; align-items:center; gap:4px; min-width:52px}
.dl{font-family:"IBM Plex Mono",monospace; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.dv{font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; font-variant-numeric:tabular-nums}
.strip{
  display:flex; gap:10px; flex-wrap:wrap; justify-content:space-around; align-items:flex-start;
  border-radius:4px; padding:10px 8px 8px;
}
.strip.bass{background:var(--panel-2); border:1px solid var(--line)}
.strip.amp{background:var(--sunk); border:1px solid var(--sunk-line)}
.strip.amp .dl{color:#8E948C}
.strip.amp .dv{color:var(--sunk-ink)}
.strip.plain{background:var(--panel-2); border:1px solid var(--line)}
/* Lionheart : panneau en inox brossé, rendu en aplat comme le reste. La couleur
   ne suit pas le thème — c'est celle de la façade, pas celle de la page. */
.strip.laney{background:#C4C9CB; border:1px solid #9BA1A4}
.strip.laney .dl{color:#4B5154}
.strip.laney .dv{color:#14181A}
.fdr{position:relative; width:14px; height:38px; border-radius:3px; background:var(--line);
  box-shadow:inset 0 0 0 1px var(--line-2); flex:none}
.fdr i{position:absolute; left:-2px; right:-2px; height:5px; border-radius:2px; background:var(--ink);
  margin-bottom:-2px}
.art{display:flex; gap:10px; align-items:flex-end; overflow-x:auto; padding:2px 0 4px}
.art svg{display:block; flex:none; height:132px; width:auto}
.art .cable{flex:none; align-self:center; color:var(--ink-3)}
.pdname{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-3); text-align:center; margin-top:3px}
.knob.plain{--face:var(--line); --ptr:var(--ink); --edge:var(--line-2)}
.gearname{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-3); margin-top:-4px}

/* ---- cards ---- */
/* min() plutôt que 300px seul : sous 300 px de large, la colonne suivrait
   l'écran au lieu de le déborder. */
.grid{display:grid; gap:13px; grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr)); margin-top:16px}
.grid > *{min-width:0}
.card{
  background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--line-2);
  border-radius:4px; padding:14px 15px 12px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow);
}
.card.k-bass{border-left-color:var(--bass)} .card.k-amp{border-left-color:var(--amp)} .card.k-reaper{border-left-color:var(--reaper)}
.card.k-pedal{border-left-color:var(--pedal)} .card.k-board{border-left-color:var(--board)}
.card.k-board{grid-column:span 2}
.card-h{display:flex; align-items:flex-start; justify-content:space-between; gap:8px}
.card-h h3{text-transform:uppercase; letter-spacing:.01em; font-size:16px}
.kind{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  padding:3px 7px; border-radius:2px; flex:none;
}
.kind.bass{background:var(--bass-soft); color:var(--bass)}
.kind.amp{background:var(--amp-soft); color:var(--amp)}
.kind.reaper{background:var(--reaper-soft); color:var(--reaper)}
.kind.pedal{background:var(--pedal-soft); color:var(--pedal)}
.kind.board{background:var(--board-soft); color:var(--board)}
.tags{display:flex; flex-wrap:wrap; gap:5px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.05em; color:var(--ink-2); border:1px solid var(--line); padding:2px 7px; border-radius:2px}
.tag.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.tag.off{color:var(--ink-3); opacity:.65}
.song{font-size:12.5px; color:var(--ink-2)}
.song b{color:var(--ink); font-weight:600}
.note{font-size:13px; color:var(--ink-2)}
/* ---- chaîne de plugins ---- */
.chain{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.slot{background:var(--panel-2); border:1px solid var(--line); border-left:2px solid var(--reaper); border-radius:4px; padding:8px 10px 9px}
.slot.bx{border-left-style:dashed; opacity:.72}
.slot-h{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; margin-bottom:6px}
.slot-h .n{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3)}
.slot-h .p{font-weight:600; font-size:13.5px}
.slot-h .r{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3); letter-spacing:.04em}
.slot-h .bp{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--warn); border:1px solid var(--warn); border-radius:2px; padding:1px 5px}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(122px,1fr)); gap:2px 10px}
.pgrid .pk{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.pgrid .pv{font-family:"IBM Plex Mono",monospace; font-size:12px; font-variant-numeric:tabular-nums; margin-bottom:3px}
.bwrap{overflow-x:auto; margin-bottom:6px}
table.bands{border-collapse:collapse; font-family:"IBM Plex Mono",monospace; font-size:11.5px; width:100%; font-variant-numeric:tabular-nums}
table.bands th{text-align:left; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
  font-weight:600; padding:0 8px 3px 0; border-bottom:1px solid var(--line)}
table.bands td{padding:2px 8px 2px 0; white-space:nowrap}
table.bands tr.bx td{opacity:.5; text-decoration:line-through}
.slot .sn{font-size:12px; color:var(--ink-2); font-style:italic; margin-top:5px}
.card-f{display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:10px; border-top:1px solid var(--line)}
.card-f .btn{padding:4px 10px; font-size:12px}
.card-f .spacer{margin-left:auto}
.empty{border:1px dashed var(--line-2); border-radius:5px; padding:34px 20px; text-align:center; color:var(--ink-2); font-size:14px}
.grp{margin-top:26px}
.grp-h{display:flex; align-items:baseline; gap:10px; padding-bottom:6px; border-bottom:1px solid var(--line-2)}
.grp-h .c{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}

/* ---- editor ---- */
.veil{position:fixed; inset:0; background:rgba(12,14,13,.55); display:none; z-index:40; padding:16px; overflow:auto}
.veil.open{display:block}
.sheet{
  max-width:660px; margin:24px auto; background:var(--panel); border:1px solid var(--line-2);
  border-radius:6px; box-shadow:0 24px 60px -20px rgba(0,0,0,.6); overflow:hidden;
}
.sheet-h{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--panel-2)}
.sheet-h h2{margin-right:auto}
.sheet-b{padding:18px; display:flex; flex-direction:column; gap:16px}
.sheet-f{display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--line); background:var(--panel-2)}
.sheet-f .spacer{margin-left:auto}
.row{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
fieldset{border:1px solid var(--line); border-radius:4px; padding:12px 14px 14px; margin:0}
legend{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); padding:0 5px}
.sl{display:grid; grid-template-columns:84px 1fr 98px; gap:10px; align-items:center; margin:7px 0}
.sl .k{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2)}
.sl .v{font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sl input[type="range"]{width:100%; accent-color:var(--acc,var(--ink))}
.sl.dim{opacity:.4}
.sug{margin:-4px 0 10px; display:flex; flex-direction:column; gap:3px}
.sug:empty{margin:0}
.sel-c select{font-weight:600}
.gate-what{font-size:13.5px; line-height:1.5; color:var(--ink-2); margin:0 0 14px; max-width:44ch}
.gate-ok{font-size:14px; line-height:1.55; color:var(--ink); margin:12px 0 0}
.badge{
  display:inline-block; min-width:16px; padding:0 4px; margin-left:5px;
  font-size:11px; line-height:16px; text-align:center; border-radius:8px;
  background:var(--warn); color:var(--bg); font-weight:700;
}
.sug .t{font-size:12px; color:var(--ink-2); padding:2px 0}
.sug .t.dup{color:var(--warn); font-weight:600}
.sug button{
  text-align:left; font:inherit; font-size:13px; cursor:pointer;
  border:1px solid var(--line); border-radius:3px; background:var(--panel-2);
  color:var(--ink); padding:5px 8px;
}
.sug button:hover{background:var(--panel)}
.sug button .k{color:var(--ink-2); font-size:11.5px; margin-left:6px}
.toggles{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px}

.seg{display:flex; flex-wrap:wrap; gap:4px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:3px; width:fit-content; max-width:100%}
.seg button{border:0; background:transparent; color:var(--ink-2); padding:5px 12px; border-radius:2px; font-size:12.5px; font-weight:600}
.seg button[aria-selected="true"]{background:var(--panel); color:var(--ink)}
.slots{display:flex; flex-direction:column; gap:10px}
.slot-e{border:1px solid var(--line); border-left:2px solid var(--reaper); border-radius:4px; padding:9px 10px;
  background:var(--panel-2); display:flex; flex-direction:column; gap:7px}
.slot-e-h{display:flex; gap:7px; align-items:center; flex-wrap:wrap}
.slot-e-h select[data-s="plugin"]{font-weight:600; min-width:130px}
select[data-gear]{font-weight:600}
.slot-e-h input[data-s="role"]{flex:1 1 130px; min-width:110px}
.slot-e .tools{display:flex; gap:4px; margin-left:auto}
.slot-e .full{width:100%}
.slot-e input[type="text"],.slot-e input[type="number"],.slot-e select{padding:5px 8px; font-size:13px}
.ck{display:inline-flex; align-items:center; gap:5px; font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2); white-space:nowrap}
.ck input{accent-color:var(--reaper)}
.mini{display:inline-flex; align-items:center; gap:5px; font-family:"IBM Plex Mono",monospace; font-size:10px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.mini input[type="number"]{width:74px; font-family:"IBM Plex Mono",monospace; text-align:right}
.mini select{font-family:"IBM Plex Sans",sans-serif; font-size:12.5px; text-transform:none; letter-spacing:0}
.mini .u{color:var(--ink-3); font-size:9.5px}
.mini.tel-quel{text-transform:none; letter-spacing:0; font-size:11px}
.pgridE{display:flex; flex-wrap:wrap; gap:7px 12px; align-items:center}
.bandsE{display:flex; flex-direction:column; gap:6px; padding:7px 8px; border:1px dashed var(--line-2); border-radius:4px}
.bandE{display:flex; flex-wrap:wrap; gap:6px 9px; align-items:center}
.bandE select[data-sb="t"]{min-width:104px; font-size:12.5px; padding:4px 6px}
.chain-acts{display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; align-items:center}
.preview{border:1px dashed var(--line-2); border-radius:5px; padding:10px 12px; display:flex;
  gap:12px; align-items:center; flex-wrap:wrap}
.preview .art{padding:0}
.preview .hint{margin:0; flex:1 1 160px}
input[type="color"]{width:100%; height:34px; padding:2px; background:var(--panel);
  border:1px solid var(--line-2); border-radius:3px}
.glrow{display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:7px 0; border-bottom:1px solid var(--line)}
.glrow:last-of-type{border-bottom:0}
.glrow .gln{font-weight:600; font-size:14px}
.glrow .glc{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3)}
.glrow .tools{margin-left:auto; display:flex; gap:5px}
.hint{font-size:12.5px; color:var(--ink-3); font-style:italic}

/* ---- porte d'entrée (déploiement autonome uniquement) ---- */
.gate{position:fixed; inset:0; z-index:80; display:none; background:var(--bg); overflow:auto; padding:24px 16px}
.gate.open{display:block}
.gate-card{
  max-width:380px; margin:8vh auto 0; background:var(--panel); border:1px solid var(--line-2);
  border-radius:6px; padding:26px 26px 22px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:16px;
}
.gate-card h1{font-size:30px}
.gate-card .eyebrow{margin-top:-6px}
.gate-card form{display:flex; flex-direction:column; gap:12px}
.gate-card input{width:100%}
.gate-err{
  font-size:13px; color:var(--danger); border-left:2px solid var(--danger); padding-left:9px; display:none;
}
.gate-err.show{display:block}
.gate-note{font-size:12.5px; color:var(--ink-3)}
.gate-demo{
  display:flex; flex-direction:column; gap:7px; align-items:stretch;
  padding-top:14px; margin-top:4px; border-top:1px solid var(--line);
}
.gate-card .seg{width:100%}
.gate-card .seg button{flex:1}
#who{display:inline-flex; gap:6px; align-items:center}
#lang{padding:2px 2px 2px 7px; gap:1px; align-items:center}
#lang .globe{color:var(--ink-3); flex:none; margin-right:4px}
#lang .tab{padding:5px 7px; font-size:11px; font-family:"IBM Plex Mono",monospace; letter-spacing:.06em}

/* ============================ téléphone ============================
   Mesuré à 390 px : la rangée d'onglets débordait de 118 px. Le reste tient
   surtout à rendre de la hauteur — sur un écran de poche, chaque bandeau fixe
   est pris sur les fiches. */
@media (max-width:620px){
  .top{gap:10px 12px; padding-bottom:12px; border-bottom-width:2px}
  .top h1{font-size:26px}
  .eyebrow{font-size:10px; letter-spacing:.1em}
  .acts{gap:6px; width:100%}
  .acts .btn{padding:7px 10px; font-size:13px}
  #lang{margin-left:auto}
  .bar{gap:8px; margin:12px 0 4px}
  #q{flex:1 1 100%; max-width:none}
  .tab{padding:5px 8px}
  .grid{gap:10px; margin-top:12px}
  .card{padding:12px}
  .grp{margin-top:18px}

  /* Le pied de page est collant : sur un téléphone, trois lignes prendraient
     un sixième de l'écran. On garde la licence et le lien, on retire la phrase. */
  .foot{font-size:11.5px; gap:3px 10px; padding:8px 0}
  .foot .sep, .foot .gratuit{display:none}
  .foot.kofi{padding-left:0; padding-bottom:72px}

  .sheet{max-height:94vh}
  .sheet-h h2{font-size:16px}
  .row{grid-template-columns:1fr}
}

/* Les cibles tactiles : 40 px, sinon on vise mal avec un pouce. */
@media (pointer:coarse){
  .btn{min-height:40px}
  .tab, .seg button{min-height:36px}
  .chip{min-height:34px}
}

/* Le clavier iOS zoome sur tout champ sous 16 px : on le lui interdit. */
@media (max-width:620px){
  input[type="text"], input[type="search"], input[type="number"],
  input[type="password"], textarea, select, label.fld input{ font-size:16px; }
}

/* ============================ impression ============================
   Ce qui est à l'écran part sur le papier : les mêmes fiches, dans le même
   ordre, débarrassées de tout ce sur quoi on ne peut pas cliquer sur une
   feuille. Le thème sombre est forcé en clair — imprimer un fond noir gâche
   l'encre et rend les cadrans illisibles. */
@page{ margin:14mm 12mm; }

@media print{
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]){
    --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F4F4F1; --sunk:#F0EFEA; --sunk-ink:#101010;
    --sunk-line:#B8B8B0; --ink:#101010; --ink-2:#333333; --ink-3:#5A5A55;
    --line:#CFCFC8; --line-2:#A8A8A0; --shadow:none;
  }
  /* Les cadrans ne disent rien sans leurs aplats : le navigateur les supprime
     par défaut à l'impression, il faut le lui interdire. */
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }

  body{background:#fff}
  .wrap{max-width:none; padding:0}
  header.top, .bar, .filters, .foot, .veil, .gate, .toast,
  .card-f, [id^="kofi-"], iframe[class*="floatingchat"]{ display:none !important; }

  .printhead{
    display:block; margin:0 0 10px; padding-bottom:6px; border-bottom:2px solid #101010;
  }
  .printhead h2{
    font-family:"Archivo",sans-serif; font-size:17px; letter-spacing:.02em; margin:0;
  }
  .printhead p{
    font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.05em;
    color:#444; margin:3px 0 0;
  }

  /* Une fiche ne se coupe jamais entre deux pages : coupée, elle ne sert plus. */
  article, .grp-h, .printhead{ break-inside:avoid; page-break-inside:avoid; }
  .grp{ margin-top:14px; break-before:auto; }
  .grp-h{ border-bottom:1px solid #101010; }
  article{
    border:1px solid #B8B8B0 !important; box-shadow:none !important;
    margin-bottom:8px; background:#fff !important;
  }
  .strip{ background:#F4F4F1 !important; border:1px solid #CFCFC8 !important; }
  .strip.amp, .strip.laney{ background:#EDEDE8 !important; }
  .strip.amp .dl, .strip.laney .dl{ color:#4A4A46 !important; }
  .strip.amp .dv, .strip.laney .dv{ color:#101010 !important; }
  a{ color:#101010; text-decoration:none; }
}

.toast{
  position:fixed; left:50%; bottom:74px; transform:translateX(-50%); z-index:60;
  background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:4px; font-size:13.5px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.6); opacity:0; pointer-events:none; transition:opacity .18s ease;
  max-width:min(520px,92vw);
}
.toast.show{opacity:1}
.toast{display:flex; align-items:center; gap:12px}
.toast .btn{flex:none; padding:3px 10px; font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

  "Un seul canal : le gain se prend au volume, et c'est le master qui décide du niveau dans la salle. Le bouton FAT épaissit les bas médiums et se commute aussi au pied.":
    "A single channel: the volume is your gain, and the master decides how loud the room gets. The FAT switch thickens the low mids and can also be footswitched.",
  "Deux canaux qui ne partagent rien : le Normal n'a qu'un volume, le Top Boost a son volume et l'égaliseur. Tone Cut agit après, sur l'étage de puissance, et se referme quand on le monte.":
    "Two channels that share nothing: Normal has only a volume, Top Boost has its own volume and the EQ. Tone Cut acts later, on the power stage, and closes down as you turn it up.",
  "Deux canaux qui partagent l'égaliseur : on choisit le canal, le gain et le volume suivent. Presence et Resonance agissent sur l'étage de puissance, donc après l'égaliseur. Tone Shift creuse les médiums d'un coup.":
    "Two channels sharing the EQ: pick the channel, and the gain and volume follow. Presence and Resonance act on the power stage, so after the EQ. Tone Shift scoops the mids in one move.",
  "Le sélecteur de type a cinq positions, notées ici de 1 à 5 : 1 = Acoustic, 2 = Clean, 3 = Crunch, 4 = Lead, 5 = Brown. Les quatre boutons d'effets règlent un dosage, pas l'effet lui-même : lequel est chargé se décide dans le logiciel, donc note-le à part.":
    "The amp type selector has five positions, written 1 to 5 here: 1 = Acoustic, 2 = Clean, 3 = Crunch, 4 = Lead, 5 = Brown. The four effect knobs set an amount, not the effect itself: which one is loaded is decided in the software, so write that down separately.",
  "Rock 70s au SVT":
    "70s rock on the SVT",
  "Ultra Lo enfoncé pour le creux de médiums, et le gain assez haut pour que l'étage d'entrée commence à chauffer. Le master fait le reste.":
    "Ultra Lo engaged for the mid scoop, and the gain high enough that the input stage starts to work. The master does the rest.",
  "Motown au doigt":
    "Motown with the fingers",
  "Médiums au premier cran, à 220 Hz : c'est là que le son parle. Aigus baissés, aucun contour, tout vient de la main droite.":
    "Mids on the first position, at 220 Hz: that is where this sound speaks. Treble down, no contour, everything comes from the right hand.",
  "Jazz rond au Little Mark":
    "Round jazz on the Little Mark",
  "VLE à 4 pour arrondir le haut sans toucher à l'égaliseur, VPF à zéro : creuser les médiums ferait disparaître la basse derrière le piano.":
    "VLE at 4 to round off the top without touching the EQ, VPF at zero: scooping the mids would bury the bass behind the piano.",
  "Répétition, son neutre":
    "Rehearsal, flat tone",
  "Tout au milieu, Tubetone à zéro : le point de départ dont on part pour régler une salle qu'on ne connaît pas.":
    "Everything at noon, Tubetone at zero: the starting point you work from in a room you do not know.",
  "Funk slap au Rumble 500":
    "Slap funk on the Rumble 500",
  "Bright et Contour ensemble : le pouce claque, l'index claque, et le milieu est laissé libre pour la guitare rythmique.":
    "Bright and Contour together: the thumb cracks, the index pops, and the middle is left free for the rhythm guitar.",
  "Blues crunch":
    "Blues crunch",
  "Le volume amène la saturation, le master ramène le niveau à ce que la salle supporte. FAT enfoncé pour épaissir un micro simple.":
    "The volume brings the breakup, the master brings the level back to what the room can take. FAT engaged to thicken a single coil.",
  "Pop 60s, son carillon":
    "60s pop, chime tone",
  "Canal Top Boost seul, aigus hauts, Tone Cut presque ouvert. Le trémolo est prêt mais à zéro : on le monte au refrain.":
    "Top Boost channel alone, treble up, Tone Cut nearly wide open. The tremolo is set but at zero: bring it in on the chorus.",
  "Rock rythmique saturée":
    "Driven rhythm rock",
  "Canal Ultra Gain. Deep et Presence remontent les deux bouts après l'égaliseur : c'est ce qui donne le poids sans embrouiller les médiums.":
    "Ultra Gain channel. Deep and Presence lift both ends after the EQ: that is what gives the weight without muddling the mids.",
  "Répétition polyvalente":
    "All-round rehearsal",
  "Type Crunch, gain bas : le son se salit à l'attaque et se nettoie au volume de la guitare. Un peu de delay pour ne pas jouer sec.":
    "Crunch type, low gain: the tone dirties on attack and cleans up from the guitar's volume. A little delay so you are not playing dry.",
  "Slap StingRay":
    "StingRay slap",
  "Le creux de médiums du préampli suffit : rien à corriger à l'ampli derrière.":
    "The preamp's mid scoop is enough on its own: nothing left to fix on the amp behind it.",
  "Fusion moderne":
    "Modern fusion",
  "Balance un peu vers le chevalet pour que les traits rapides sortent, aigus montés pour les harmoniques.":
    "Blend a little towards the bridge so the fast lines come through, treble up for the harmonics.",
  "Motown à la Precision":
    "Motown on the Precision",
  "Volume à fond, tonalité aux trois quarts fermée : le haut du spectre est laissé à la batterie et aux cuivres.":
    "Volume wide open, tone three quarters closed: the top end is left to the drums and the horns.",
  "Chevalet seul, indie":
    "Bridge pickup alone, indie",

    "The bridge pickup on its own, nasal and dry. Opening the neck up even slightly thickens it at once, so it stays at zero.",

  "Bouton blanc, repère bleu, panneau inox": "White knob, blue marker, stainless panel",
  "Volume clean": "Clean volume",
  "Volume drive": "Drive volume",
  "Deux canaux à lampes qui partagent l'égaliseur, plus un Tone global et la réverbe. Le canal saturé se prend au pied. La façade imprime « VOLUME » deux fois, sous CLEAN et sous DRIVE : ils sont distingués ici pour rester lisibles. Échelle 0–10.": "Two valve channels sharing the EQ, plus a global Tone and the reverb. The drive channel is footswitchable. The panel prints “VOLUME” twice, under CLEAN and under DRIVE: they are told apart here to stay readable. Scale 0–10.",
  "Clair British": "British clean",
  "Le Bright fait le tintement, le Tone finit de dégager l'aigu. Monter le volume jusqu'au bord de la saturation : c'est là que la classe A respire.": "Bright makes the chime, Tone finishes clearing the top end. Push the volume to the edge of breakup: that is where class A breathes.",
  "Bord de saturation": "Edge of breakup",
  "Canal clair poussé, pas le canal Drive : la saturation vient des lampes de puissance et suit le potard de la guitare. C'est le réglage à essayer avant tout autre.": "The clean channel pushed, not the Drive channel: the grit comes from the output valves and follows the guitar's volume pot. This is the setting to try before any other.",
  "Blues crémeux": "Creamy blues",
  "Drive à peine engagé, médiums en avant : le grain se fait à l'attaque, pas au gain.": "Drive barely engaged, mids forward: the grain comes from the attack, not from the gain.",
  "Crunch rythmique": "Rhythm crunch",
  "De quoi tenir une rythmique sans noyer l'accord. Le Tone au-dessus de midi rend l'attaque audible dans un mix.": "Enough to hold a rhythm part without drowning the chord. Tone above noon keeps the attack audible in a mix.",
  "Le terrain d'origine de cet ampli : le grain britannique, médiums tenus, aigu contenu par le Tone pour éviter la lame de rasoir.": "This amp's home ground: British grit, mids held up, top end reined in by Tone to avoid the razor blade.",
  "Lead chantant": "Singing lead",
  "Les médiums font le sustain, pas le gain. Au-delà de 8, l'ampli compresse et l'attaque disparaît — mieux vaut une pédale devant que de tout demander au préampli.": "The mids make the sustain, not the gain. Past 8 the amp compresses and the attack disappears — better a pedal in front than asking everything of the preamp.",
  "Jazz / chaud": "Jazz / warm",
  "Bright coupé, Tone sous midi : l'aigu qu'on retire ici est celui qui claque sur les rondes.": "Bright off, Tone below noon: the top end removed here is the one that clacks on roundwounds.",
  "Appartement": "Flat-friendly",
  "Vingt watts à lampes ne se règlent pas à 2 sans perdre le grave : les médiums compensent ce que le volume ne donne pas. Ne gardez pas ce réglage pour la salle.": "Twenty valve watts cannot sit at 2 without losing the low end: the mids make up for what the volume will not give. Do not keep this setting for the venue.",
  "Essayer la démonstration": "Try the demo",
  "Un compte ouvert à tous, pour regarder sans s'inscrire. Ses fiches repartent de zéro à chaque redémarrage du serveur.":
    "An account open to everyone, to look around without signing up. Its presets are wiped every time the server restarts.",

  "Volume à 100 %. Plus d'attaque que sur Yellow, sans rendre la basse métallique — les positions viennent en pourcentage de course : balance 45 % manche / 55 % chevalet, Bass 55 %, Treble 52 %.": "Volume at 100%. More attack than on Yellow, without turning the bass metallic — positions are given as a percentage of travel: blend 45% neck / 55% bridge, Bass 55%, Treble 52%.",
  "L'ordre qui marche presque partout : dynamique, puis grain, puis correction. L'accordeur et l'overdrive attendent au pied.": "The order that works almost everywhere: dynamics, then grit, then correction. The tuner and the overdrive wait at your feet.",
  "Le compresseur avant le filtre : sinon la sensibilité suit les écarts de niveau du jeu.": "The compressor before the filter: otherwise sensitivity follows the level swings of your playing.",
  "Les deux bandes qui font le caractère : 900 Hz et 2,5 kHz.": "The two bands that make the character: 900 Hz and 2.5 kHz.",
  "Threshold : descendre jusqu'à 4–5 dB de réduction sur les attaques fortes.": "Threshold: bring it down until you get 4–5 dB of reduction on the loud attacks.",
  "Pas plus : le BOD apporte déjà le caractère.": "No more than that: the BOD already brings the character.",
  "Laissée hors circuit : c'est elle qui causait le claquement. À comparer dans le mix avant de trancher.": "Left out of circuit: it was the one causing the click. Compare it in the mix before deciding.",
  "Le caractère All Star tient aux bandes 900 Hz et 2,5 kHz : c'est la présence, pas le volume.": "The All Star character comes from the 900 Hz and 2.5 kHz bands: it is presence, not volume.",
  "Une façade décrit les commandes d'un instrument ou d'un ampli. Les façades livrées se dupliquent pour servir de point de départ.": "A front panel describes the controls of an instrument or an amp. Shipped panels can be duplicated to serve as a starting point.",

function t(s){
  if (LANG !== "en") return s;
  var v = EN[String(s)];
  return v === undefined ? s : v;
}

/** Traduit les textes visibles d'un fragment ; les attributs sont épargnés. */
function tHtml(h){
  if (LANG !== "en") return h;
  /* Un fragment sans balise est du texte : il se traduit en entier. */
  if (String(h).indexOf("<") < 0) return t(h);
  return String(h).replace(/>([^<>]+)</g, function(tout, txt){
    var net = txt.trim();
    if (!net) return tout;
    var v = EN[net];
    return v === undefined ? tout : ">" + txt.replace(net, v) + "<";
  });
}
function setHtml(el, h){ if (el) el.innerHTML = tHtml(h); }

/** Un message à trou : le motif se traduit, puis les valeurs s'y insèrent. */
function tf(motif){
  var args = arguments;
  return String(t(motif)).replace(/\{(\d)\}/g, function(tout, i){
    var v = args[Number(i) + 1];
    return v === undefined ? tout : String(v);
  });
}

/** La date du jour, pour l'en-tête d'une feuille imprimée. */
function printDate(){
  try { return new Date().toLocaleDateString(LANG === "en" ? "en-GB" : "fr-FR",
    {year:"numeric", month:"long", day:"numeric"}); }
  catch (e) { return new Date().toISOString().slice(0, 10); }
}

/** Séparateur décimal : virgule en français, point en anglais. */
function dec(s){ return LANG === "en" ? String(s) : String(s).replace(".", ","); }

function detectLang(){
  var q = null;
  try { q = new URLSearchParams(window.location.search).get("lang"); } catch (e) { /* pas d'URL */ }
  if (q === "en" || q === "fr") return q;
  if (S && (S.lang === "en" || S.lang === "fr")) return S.lang;
  try { if (/^en/i.test(window.navigator.language || "")) return "en"; } catch (e) { /* sans objet */ }
  return "fr";
}

/** Applique la langue déduite de l URL, des données ou du navigateur. */
/* L'en-tête et la barre de recherche : leurs libellés vivent ici, pas dans le
   gabarit, pour passer par la traduction comme le reste de l'interface. */
function renderChrome(){
  var el = document.getElementById.bind(document);
  setHtml(el("eyebrow"), "Instruments · amplis · pédales · chaînes de plugins");
  setHtml(el("btn-gear"), "Matériel");
  setHtml(el("btn-io"), "Sauvegarde");
  setHtml(el("btn-new"), "Nouveau preset");
  setHtml(el("btn-print"), "Imprimer");
  setHtml(el("btn-install"), "Installer");
  setHtml(el("btn-shared"), "Partagés");
  var q = document.getElementById("q");
  q.setAttribute("placeholder", t("Chercher un style, un morceau, un plugin…"));
  q.setAttribute("aria-label", t("Chercher"));
  /* Une phrase, un seul segment de texte : « sous » entre deux balises formerait
     un segment à lui seul, absent du dictionnaire, et resterait en français. */
  setHtml(el("foot"),
    '<span>Presetbook · <a class="lic"' +
    ' href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener noreferrer">' +
    'logiciel libre sous AGPL-3.0</a></span>' +
    '<span class="sep">·</span>' +
    '<span class="gratuit">Gratuit, et le restera. Les dons sont bienvenus, jamais demandés.</span>' +
    (KOFI ? '<span class="sep">·</span><a href="https://ko-fi.com/' + esc(KOFI) + '"' +
            ' target="_blank" rel="noopener noreferrer">Me soutenir</a>' : ""));
  var grp = document.getElementById("grp");
  grp.setAttribute("aria-label", t("Regrouper"));
  grp.innerHTML = tHtml(
    '<button role="tab" data-g="kind" aria-selected="' + (ui.group === "kind") + '">Par matériel</button>' +
    '<button role="tab" data-g="brand" aria-selected="' + (ui.group === "brand") + '">Par marque</button>' +
    '<button role="tab" data-g="song" aria-selected="' + (ui.group === "song") + '">Par morceau</button>');
}

function applyLang(){
  LANG = detectLang();
  try { document.documentElement.setAttribute("lang", LANG); } catch (e) { /* sans objet */ }
  renderLangPicker();
  renderChrome();
}

function setLang(l){
  LANG = l === "en" ? "en" : "fr";
  S.lang = LANG;
  try { document.documentElement.setAttribute("lang", LANG); } catch (e) { /* sans objet */ }
  renderLangPicker();
  renderChrome();
  render();
  save();
}

function pluginDef(name){
  var d = PLUGINS[name] || PLUGINS["Autre plugin"];
  if (!d.params) d.params = [];   /* ReaEQ na que des bandes : on garantit la clé */
  return d;
}
function decimalsOf(step){
  var t = String(step), i = t.indexOf(".");
  return i < 0 ? 0 : t.length - i - 1;
}
function fmtParam(def, v){
  if (v === null || v === undefined || v === "") return "à régler";
  if (def.t === "bool") return v ? "ON" : "OFF";
  if (def.t === "enum") return String(v);
  if (def.inf && Number(v) <= def.min) return "−∞";
  var s = dec(def.step ? Number(v).toFixed(decimalsOf(def.step)) : String(v));
  return def.u ? s + " " + def.u : s;
}

/* ============================ modèle ============================ */
/* Sur la BB, un bouton va de 7 h à 5 h : 0 = cran central (12 h), ±5 crans, 1 cran = 10 % de course. */
function hourLabel(v){
  var total = 12 + Math.max(-5, Math.min(5, v));
  var h = Math.floor(total), m = Math.round((total - h) * 60);
  if (m === 60){ h += 1; m = 0; }
  if (LANG === "en") return h + ":" + (m < 10 ? "0" + m : m);
  return h + " h" + (m ? " " + (m < 10 ? "0" + m : m) : "");
}
function hourAngle(v){ return (v * 30) + "deg"; }
function pctToCrans(p){ return Math.round(((p - 50) / 10) * 4) / 4; }  /* 55 % -> +0,5 ; 52 % -> +0,25 */
function ampAngle(v){ return (-150 + (v - 1) * (300 / 9)) + "deg"; }
function ampLabel(v){ return dec(v); }
/* Position exacte plutôt qu'un palier : c'est en pourcentage de course qu'on lit un balancer. */
function balLabel(b){
  if (b <= 4) return LANG === "en" ? "P only" : "P seul";
  if (b >= 96) return LANG === "en" ? "J only" : "J seul";
  return "P " + (100 - b) + " / J " + b;
}

function bass(id,name,tags,mode,bal,eq,tech,strings,aim){
  return {id:id, kind:"bass", name:name, tags:tags, mode:mode, balance:bal,
          eq:eq, tech:tech, strings:strings, notes:aim, song:null};
}
function amp(id,name,tags,gain,btn,od,eq,aim){
  return {id:id, kind:"amp", name:name, tags:tags, gain:gain,
          bright:btn.indexOf("bright")>=0, contour:btn.indexOf("contour")>=0, vintage:btn.indexOf("vintage")>=0,
          od:od, eq:eq, notes:aim, song:null};
}
/** Une fiche pour le Lionheart : deux canaux, égaliseur partagé, Tone global. */
function laney(id,name,tags,bright,vol,dr,eq,rev,tone,aim){
  return {id:id, kind:"amp", gear:"lionheart20", name:name, tags:tags,
          bright:bright, vol:vol, dr:dr, eq:eq, rev:rev, tone:tone, notes:aim, song:null};
}
/**
 * Une fiche pour n'importe quel matériel du catalogue.
 *
 * Les constructeurs au-dessus sont taillés pour un modèle précis. Celui-ci
 * prend les valeurs à plat, avec les mêmes clés pointées que les commandes
 * déclarées dans GEAR — « eq.b » se range sous « eq », comme partout ailleurs.
 */
function mat(id, gear, kind, name, tags, vals, aim){
  var p = {id:id, kind:kind, gear:gear, name:name, tags:tags, notes:aim, song:null};
  Object.keys(vals).forEach(function(cle){
    var bouts = cle.split("."), ou = p;
    while (bouts.length > 1){
      var b = bouts.shift();
      if (!ou[b]) ou[b] = {};
      ou = ou[b];
    }
    ou[bouts[0]] = vals[cle];
  });
  return p;
}

function chain(id,name,tags,tempo,tuning,rows,aim){
  return {id:id, kind:"reaper", name:name, tags:tags, tempo:tempo, tuning:tuning,
          chain:rows, notes:aim, song:null};
}
function slot(plugin,role,params,note){
  var s = {plugin:plugin, role:role, on:true, p:params || {}, settings:note || ""};
  if (pluginDef(plugin).bands) s.bands = [];
  return s;
}
function eqSlot(role,bands,note){
  return {plugin:"ReaEQ", role:role, on:true, p:{}, bands:bands, settings:note || ""};
}
function band(t,f,g,bw){ return {t:t, f:f, g:g, bw:bw, on:true}; }
function bypassed(s){ s.on = false; return s; }
function forSong(p,title,artist){ p.song = {title:title, artist:artist}; return p; }

/** Une fiche de pédale : les valeurs sont posées à plat sur la fiche. */
function pedal(id, gear, name, tags, vals, aim){
  var o = {id:id, kind:"pedal", gear:gear, name:name, tags:tags, notes:aim, song:null}, k;
  for (k in vals) o[k] = vals[k];
  return o;
}
/** Un pédalier : des emplacements dans l'ordre du signal. */
function board(id, name, tags, slots, aim){
  return {id:id, kind:"board", name:name, tags:tags, slots:slots, notes:aim, song:null};
}
function ps(gear, role, vals, on){
  return {gear:gear, role:role, on: on === false ? false : true, v: vals || {}};
}

function psw(k, l){ return {k:k, t:"switch", l:l}; }

/* Les pédales entrent dans le registre général : une pédale est une façade. */
(function(){
  var k;
  for (k in PEDALS){
    GEAR[k] = {
      kind:"pedal", brand:PEDALS[k].brand || "générique", model:PEDALS[k].model, face:"plain",
      color:PEDALS[k].color, style:PEDALS[k].style, perRow:PEDALS[k].perRow,
      note:PEDALS[k].note || "",
      controls:PEDALS[k].controls, extras:[]
    };
  }
})();

var DEFAULT_GEAR = { bass:"bb734a", amp:"rumble40", pedal:"pd-od" };

/** Le matériel d'une fiche ; les fiches d'avant gardent le matériel d'origine. */
function gearOf(p){
  var reg = allGear();
  var id = p.gear || DEFAULT_GEAR[p.kind];
  return reg[id] || reg[DEFAULT_GEAR[p.kind]] || GEAR.bb734a;
}
function gearId(p){ return p.gear || DEFAULT_GEAR[p.kind]; }
function gearName(g){
  return (!g.brand || g.brand === "générique") ? g.model : g.brand + " " + g.model;
}
function gearList(kind){
  var reg = allGear(), out = [], k;
  for (k in reg) if (reg[k].kind === kind) out.push({id:k, g:reg[k], own:isOwnGear(k)});
  out.sort(function(a, b){
    if (a.own !== b.own) return a.own ? 1 : -1;
    return gearName(a.g).localeCompare(gearName(b.g), "fr");
  });
  return out;
}
/** Registre livré, plus les façades créées ici. */
function allGear(){
  var out = {}, k;
  for (k in GEAR) out[k] = GEAR[k];
  if (S.gear) for (k in S.gear) out[k] = S.gear[k];
  return out;
}
function isOwnGear(id){ return !!(S.gear && S.gear[id]); }
/** Combien de fiches utilisent ce matériel. */
function gearUsage(id){
  var L = library(), n = 0, i, j, sl0;
  for (i=0;i<L.length;i++){
    if (L[i].kind === "board"){
      sl0 = L[i].slots || [];
      for (j=0;j<sl0.length;j++) if (sl0[j].gear === id) { n++; break; }
      continue;
    }
    if (L[i].kind !== "reaper" && gearId(L[i]) === id) n++;
  }
  return n;
}
function numLabel(v, step){
  return dec(step ? Number(v).toFixed(decimalsOf(step)) : String(v));
}

var ui = {kind:"all", q:"", group:"kind", gear:[], brands:[], tags:[], open:false};

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function library(){
  var out = [];
  for (var i=0;i<SEED.length;i++){
    var s = SEED[i];
    if (S.hidden.indexOf(s.id) >= 0) continue;
    out.push(S.overrides[s.id] ? clone(S.overrides[s.id]) : clone(s));
  }
  for (var j=0;j<S.custom.length;j++) out.push(clone(S.custom[j]));
  return out;
}
function isSeed(id){ for (var i=0;i<SEED.length;i++) if (SEED[i].id === id) return true; return false; }
function findPreset(id){ var L = library(); for (var i=0;i<L.length;i++) if (L[i].id === id) return L[i]; return null; }

/* ============================ persistance ============================ */
function setStore(mode, msg){
  store.mode = mode;
  var dot = document.getElementById("store-dot"), txt = document.getElementById("store-txt");
  dot.className = "dot " + (mode === "api" || mode === "artifact" ? "ok"
                          : mode === "local" || mode === "locked" ? "warn" : "err");
  txt.textContent = t(msg);
}

function readLocal(){
  try {
    var raw = window.localStorage.getItem(LS_KEY) || window.localStorage.getItem(LS_KEY_OLD);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function writeLocal(){
  try { window.localStorage.setItem(LS_KEY, JSON.stringify(S)); return true; }
  catch (e) { return false; }
}

function save(){
  S.updated = new Date().toISOString();
  var payload = JSON.stringify(S, null, 1);
  if (store.api){
    return fetch(API, {method:"PUT", headers:{"Content-Type":"application/json"},
                       body:payload, credentials:"same-origin"})
      .then(function(r){
        if (r.status === 401){                       /* session expirée : ne pas dévier vers un autre stockage */
          store.api = false;
          setStore("locked", "session expirée");
          showGate();
          throw new Error("session expirée — reconnecte-toi, tes modifications sont toujours à l'écran");
        }
        if (!r.ok) throw new Error("HTTP " + r.status);
        setStore("api", "enregistré sur le serveur");
        return true;
      }).catch(function(err){
        if (/session expirée/.test(err.message)){ toast(err.message); return false; }
        if (writeLocal()){
          setStore("local", "serveur injoignable, gardé ici");
          toast(tf("Le serveur n'a pas répondu ({0}) — enregistré dans ce navigateur.", err.message));
          return true;
        }
        setStore("memory", "session seulement");
        toast(tf("Le serveur n'a pas répondu ({0}). Exporte ta sauvegarde.", err.message));
        return false;
      });
  }
  if (store.writer){
    var files = {}; files[DATA_PATH] = payload;
    return store.writer.publish(files).then(function(){
      setStore("artifact", "enregistré en ligne");
      return true;
    }).catch(function(err){
      var code = (err && err.code) || "upstream_error";
      if (code === "conflict"){ toast("Une autre fenêtre a enregistré avant celle-ci — elle va se recharger."); return false; }
      store.writer = null;
      if (writeLocal()){ setStore("local", "enregistré dans ce navigateur"); toast(tf("Écriture en ligne indisponible ({0}) — enregistré localement.", code)); return true; }
      setStore("memory", "session seulement"); toast(tf("Impossible d'enregistrer ({0}). Exporte ta sauvegarde.", code)); return false;
    });
  }
  if (writeLocal()){ setStore("local", "enregistré dans ce navigateur"); return Promise.resolve(true); }
  setStore("memory", "session seulement");
  toast("Aucun stockage disponible : exporte ta sauvegarde avant de fermer.");
  return Promise.resolve(false);
}

function fetchJson(url){
  return fetch(url, {cache:"no-store", headers:{"Accept":"application/json"}}).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

/* Filtre initial repris de l'URL : ?q=…&kind=bass|amp|reaper&group=song — un filtre se met en favori. */
/**
 * Récupère « ?invite=… » puis le retire de l'URL.
 *
 * Un jeton qui reste dans la barre d'adresse finit dans l'historique, dans les
 * captures d'écran et dans les liens qu'on repartage sans y penser. Il ne sert
 * qu'une fois : autant qu'il ne traîne pas.
 */
function readInvite(){
  try {
    var qp = new URLSearchParams(window.location.search);
    var jeton = qp.get("invite");
    if (!jeton) return;
    invitation = jeton;
    qp.delete("invite");
    var reste = qp.toString();
    window.history.replaceState(null, "",
      window.location.pathname + (reste ? "?" + reste : "") + window.location.hash);
  } catch (e) { /* pas d'URL exploitable */ }
}

function readUrlFilter(){
  try {
    var qp = new URLSearchParams(window.location.search);
    var q = qp.get("q"), kind = qp.get("kind"), group = qp.get("group");
    /* Listes séparées par des virgules : ?gear=rumble40,lionheart20&tag=rock,blues */
    var liste = function(v){ return v ? v.split(",").map(function(x){ return x.trim(); }).filter(Boolean) : []; };
    ui.gear = liste(qp.get("gear"));
    ui.brands = liste(qp.get("brand"));
    ui.tags = liste(qp.get("tag"));
    if (ui.gear.length || ui.brands.length || ui.tags.length) ui.open = true;
    if (q) ui.q = q;
    if (kind === "all" || KINDS[kind]) ui.kind = kind;   /* toute famille connue */
    if (group === "song" || group === "kind" || group === "brand") ui.group = group;
    document.getElementById("q").value = ui.q;
    Array.prototype.forEach.call(document.querySelectorAll("#grp [data-g]"), function(b){
      b.setAttribute("aria-selected", String(b.getAttribute("data-g") === ui.group));
    });
  } catch (e) { /* pas d'URL exploitable : on garde les valeurs par défaut */ }
}

function post(url, body){
  return fetch(url, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body || {}), credentials:"same-origin"
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
      return j;
    });
  });
}

  var el = document.getElementById("del-err");
  if (!el) return;
  el.textContent = t(msg);
  el.classList.add("show");
}

var delArme = false;
function submitDelete(f){
  var btn = f.querySelector('button[type="submit"]');
  if (!delArme){
    /* Deux clics : la première pression arme, la seconde exécute. */
    delArme = true;
    setHtml(btn, "Confirmer la suppression");
    btn.classList.add("danger");
    deleteError("Encore un clic, et c'est définitif.");
    return;
  }
  btn.disabled = true;
  post("api/account/delete", {password: f.elements.password.value}).then(function(){
    window.location.reload();      /* plus de session : on repart de l'écran d'accueil */
  }, function(err){
    btn.disabled = false;
    delArme = false;
    setHtml(btn, "Supprimer définitivement");
    deleteError(err.message);
  });
}

/** Le lien complet à transmettre. Il n'existe qu'ici : le serveur ne le garde pas. */
function inviteLink(jeton){
  return window.location.origin + window.location.pathname + "?invite=" + encodeURIComponent(jeton);
}

function newInvite(btn){
  btn.disabled = true;
  post("api/invites").then(function(j){
    btn.disabled = false;
    var lien = inviteLink(j.token);
    var out = document.getElementById("inv-out");
    /* Affiché une seule fois : le serveur n'en garde que l'empreinte. */
    setHtml(out, "");
    out.innerHTML = tHtml('<p class="hint">À transmettre — ce lien ne sera plus affiché :</p>' +
      '<textarea id="inv-lien" rows="2" readonly></textarea>' +
      '<div class="acts"><button class="btn" data-copyinvite>Copier le lien</button></div>');
    var champ = document.getElementById("inv-lien");
    if (champ){ champ.value = lien; champ.select(); }
    loadInvites();
  }, function(err){
    btn.disabled = false;
    toast(err.message);
  });
}

function copyInvite(){
  var champ = document.getElementById("inv-lien");
  if (!champ) return;
  champ.select();
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(champ.value).then(function(){ toast("Lien copié."); },
      function(){ toast("Sélectionne le lien et fais Ctrl+C."); });
  } else toast("Sélectionne le lien et fais Ctrl+C.");
}

/**
 * Les demandes de compte en attente.
 *
 * L'application n'envoie rien : elle n'a aucune dépendance, donc pas de client
 * de courrier. Elle prépare le lien et rappelle l'adresse ; l'envoi reste un
 * geste humain — c'est aussi ce qui évite qu'un serveur d'envoi soit détourné.
 */
function loadRequests(){
  var host = document.getElementById("req-list");
  if (!host) return;
  fetchJson("api/requests").then(function(j){
    var l = (j && j.requests) || [];
    session.requests = l.length;

    if (!l.length){
      setHtml(host, "Personne n'attend de compte.");
      return;
    }
    host.innerHTML = tHtml('<div class="ulist">' + l.map(function(r){
      /* L'adresse voyage en attribut plutôt que d'être relue dans le texte
         affiché : la mise en forme n'a pas à décider de ce qu'on envoie. */
      return '<div class="urow" data-req="' + esc(r.id) + '" data-email="' + esc(r.email) + '"' +
        ' data-name="' + esc(r.name) + '">' +
        '<span class="uname">' + esc(r.name) + '</span>' +
        '<span class="mini tel-quel" style="opacity:.7">' + esc(r.email) + '</span>' +
        (r.note ? '<span class="mini tel-quel" style="opacity:.6">' + esc(r.note) + '</span>' : "") +

  }, function(){ setHtml(host, "Demandes indisponibles."); });
}

/** Fabriquer le lien pour une demande précise, et rappeler à qui l'envoyer. */
/**
 * Le message d'invitation, prêt à partir depuis le client du poste.
 *
 * Un lien « mailto: » confie l'envoi au logiciel déjà configuré — Thunderbird,
 * Outlook, celui du téléphone. L'application ne gagne aucune dépendance et
 * n'envoie toujours rien elle-même : elle rédige, le client expédie.
 *
 * Les sauts de ligne d'un corps mailto s'écrivent %0D%0A ; encodeURIComponent
 * s'en charge à partir de vrais retours à la ligne.
 */
function mailtoInvite(nom, adresse, lien){
  var objet = t("Ton invitation pour Presetbook");
  var corps = tf(
    "Bonjour {0},\n\n" +
    "Voici ton lien d'invitation pour Presetbook :\n\n{1}\n\n" +
    "Il ne sert qu'une fois et expire dans une semaine. Tu choisiras toi-même ton " +
    "identifiant et ton mot de passe : personne d'autre ne les connaîtra.\n\n" +
    "À bientôt.",
    nom, lien);
  return "mailto:" + encodeURIComponent(adresse) +
         "?subject=" + encodeURIComponent(objet) +
         /* RFC 6068 veut des CRLF dans le corps. Avec des LF seuls, certains
            clients — Outlook le premier — recollent les paragraphes. */
         "&body=" + encodeURIComponent(corps.replace(/\n/g, "\r\n"));
}

function inviteForRequest(id, btn){
  var ligne = document.querySelector('[data-req="' + id + '"]');
  var adresse = ligne ? ligne.getAttribute("data-email") || "" : "";
  var nom = ligne ? ligne.getAttribute("data-name") || "" : "";
  btn.disabled = true;
  post("api/invites").then(function(j){
    btn.disabled = false;
    var out = document.getElementById("req-out");
    if (!out) return;
    out.innerHTML = tHtml('<p class="hint">Le lien ne sera plus affiché. Envoie-le toi-même : ' +
      'l\'application n\'a pas de client de courrier.</p>' +
      '<label class="fld">À<input type="text" id="req-to" readonly></label>' +
      '<label class="fld">Lien d\'invitation<textarea id="inv-lien" rows="2" readonly></textarea></label>' +
      '<div class="acts">' +
      '<a class="btn primary" id="req-mail" href="#">Ouvrir dans la messagerie</a>' +
      '<button class="btn" data-copyinvite>Copier le lien</button>' +
      '<button class="btn ghost" data-reqdel="' + esc(id) + '">Demande traitée, l\'écarter</button></div>');
    var a = document.getElementById("req-to");
    if (a) a.value = adresse;
    var champ = document.getElementById("inv-lien");
    if (champ){ champ.value = inviteLink(j.token); champ.select(); }
    /* L'adresse « mailto: » est posée après coup : elle porte le jeton, et un
       href écrit dans la chaîne de gabarit passerait par tHtml, qui laisse les
       attributs tranquilles mais n'a aucune raison de voir ça. */
    var lienMail = document.getElementById("req-mail");
    if (lienMail) lienMail.setAttribute("href", mailtoInvite(nom, adresse, inviteLink(j.token)));
    loadInvites();
  }, function(err){
    btn.disabled = false;
    toast(err.message);
  });
}

/** Les invitations en attente : de quoi révoquer un lien qu'on regrette. */

  var host = document.getElementById("inv-list");

  fetchJson("api/invites").then(function(j){
    var l = (j && j.invites) || [];
    if (!l.length){ setHtml(host, ""); return; }
    host.innerHTML = tHtml('<div class="ulist">' + l.map(function(i){
      return '<div class="urow"><span class="mini">' + t("Invitation en attente") + '</span>' +
        '<span class="mini" style="opacity:.6">' + esc(String(i.expires || "").slice(0, 10)) + '</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn small ghost danger" data-invdel="' + esc(i.id) + '">Révoquer</button>' +
        '</div>';
    }).join("") + '</div>');
  }, function(){ setHtml(host, ""); });
}

/** L'administrateur supprime un autre compte : mot de passe exigé, deux clics. */
function adminDelete(btn){
  var id = btn.getAttribute("data-udel"), nom = btn.getAttribute("data-uname");
  if (btn.getAttribute("data-armed") !== "1"){
    btn.setAttribute("data-armed", "1");
    setHtml(btn, "Confirmer ?");
    window.setTimeout(function(){
      if (btn.isConnected){ btn.removeAttribute("data-armed"); setHtml(btn, "Supprimer"); }
    }, 4000);
    return;
  }
  var mdp = document.querySelector('#pw-form input[name="current"]');
  var pass = mdp ? mdp.value : "";
  if (!pass){
    toast("Renseigne ton mot de passe actuel, en haut, pour confirmer.");
    return;
  }
  btn.disabled = true;
  post("api/account/delete", {id:id, password:pass}).then(function(){
    toast(tf("Compte supprimé : {0}", nom));
    loadUsers();
  }, function(err){
    btn.disabled = false;
    btn.removeAttribute("data-armed");
    setHtml(btn, "Supprimer");
    toast(err.message);
  });
}

function passwordError(msg){
  var el = document.getElementById("pw-err");
  if (!el) return;
  el.textContent = t(msg);
  el.classList.add("show");
}

function submitPassword(f){
  var actuel = f.elements.current.value;
  var neuf = f.elements.password.value;
  var encore = f.elements.again.value;
  if (neuf !== encore){ passwordError("Les deux mots de passe ne sont pas identiques."); return; }
  if (neuf.length < 10){ passwordError("Mot de passe : au moins 10 caractères."); return; }
  if (neuf === actuel){ passwordError("Le nouveau mot de passe est identique à l'ancien."); return; }
  var btn = f.querySelector('button[type="submit"]');
  btn.disabled = true;
  post("api/password", {current:actuel, password:neuf}).then(function(j){
    closeEditor();
    toast(j && j.closed ? tf("Mot de passe changé, {0} autre(s) session(s) fermée(s).", j.closed)
                        : "Mot de passe changé.");
  }, function(err){
    btn.disabled = false;
    passwordError(err.message);
  });
}

function submitAccount(f){

    accountError("C'est ton propre identifiant."); return;

}

/* ?edit=<id> ouvre directement une fiche : pratique pour envoyer un lien vers un réglage précis. */
function openFromUrl(){

    if (qp.get("new")){ openNewSheet(); return; }     /* raccourci du manifeste */
    var id = qp.get("edit");
