/* ============================ installation ============================
   Deux choses distinctes : le service worker, qui rend l'application ouvrable
   sans réseau, et l'invite d'installation, que le navigateur ne propose qu'à
   ses conditions. On n'insiste pas : le bouton n'apparaît que si le navigateur
   a lui-même signalé que c'était possible.

   Le nom compte : « invitation » désigne déjà le jeton d'un lien d'invitation,
   quelques centaines de lignes plus haut. Deux « var » de même nom au même
   niveau ne font qu'une seule variable — l'invite d'installation écrasait le
   jeton, et la page croyait tenir une invitation là où le navigateur ne
   proposait que de s'installer.                                             */
var installPrompt = null;

function installable(){
  var b = document.getElementById("btn-install");
  if (b) b.hidden = !installPrompt;
}

function setupInstall(){
  /* Pas de service worker hors d'un vrai serveur : ni depuis un fichier local,
     ni dans la page publiée, où la politique de sécurité l'interdirait. */
  if (window.claude) return;
  try {
    if (window.location.protocol.indexOf("http") === 0 && navigator.serviceWorker){
      /* updateViaCache:"none" : le serveur sert les .js avec une heure de cache,
         et sans cette option le navigateur garderait un service worker périmé
         aussi longtemps avant même de vérifier s il a changé. */
      navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).catch(function(){
        /* Refusé — l'application marche pareil, elle ne s'ouvrira pas hors ligne. */
      });
    }
  } catch (e) { /* sans objet */ }

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();               /* on garde la main sur le moment */
    installPrompt = e;
    installable();
  });
  window.addEventListener("appinstalled", function(){
    installPrompt = null;
    installable();
    toast("Presetbook est installé.");
  });
}

function doInstall(){
  if (!installPrompt) return;
  var e = installPrompt;
  installPrompt = null;
  installable();
  e.prompt();
}

/* ============================ soutien ============================
   Le widget de dons est servi par un tiers, donc il n'est chargé qu'une fois
   la session ouverte : un script qu'on ne sert pas soi-même n'a rien à faire
   sur la même page qu'un champ de mot de passe. Vider KOFI le retire
   entièrement, pied de page compris.                                        */
var KOFI = "talva";
var kofiMounted = false;

function mountKofi(){
  if (kofiMounted || !KOFI) return;
  if (window.claude) return;      /* page publiée : la politique de sécurité bloque les tiers */
  kofiMounted = true;
  try {
    var s = document.createElement("script");
    s.src = "https://storage.ko-fi.com/cdn/scripts/overlay-widget.js";
    s.async = true;
    s.onload = function(){
      try {
        window.kofiWidgetOverlay.draw(KOFI, {
          "type": "floating-chat",
          "floating-chat.donateButton.text": t("Me soutenir"),
          "floating-chat.donateButton.background-color": "#323842",
          "floating-chat.donateButton.text-color": "#fff"
        });
      } catch (e) { /* le tiers a changé d'interface : le lien du pied de page reste */ }
    };
    (document.head || document.body).appendChild(s);
    var f = document.getElementById("foot");
    if (f) f.classList.add("kofi");        /* la place réservée suit le bouton, pas l'inverse */
  } catch (e) { /* rien à faire : le pied de page porte déjà le lien */ }
}

function boot(){
  readInvite();
  readUrlFilter();
  setupInstall();
  applyLang();
  render();                                        /* le catalogue livré s'affiche tout de suite */
  openFromUrl();

  fetchJson("api/session").then(function(sess){    /* 1. serveur autonome */
    session = sess || session;
    if (session.user){ mountKofi(); return loadFromApi().then(announceRequests); }
    setStore("locked", "connexion requise");
    showGate();
  }, function(){
    return fetchJson(DATA_PATH).then(function(j){  /* 2. page publiée */
      if (j && typeof j === "object"){ S = normalize(j); applyLang(); render(); setStore("artifact", "chargé en ligne"); }
    }, function(){                                 /* 3. navigateur seul */
      var l = readLocal();
      if (l){ S = normalize(l); applyLang(); render(); setStore("local", "chargé du navigateur"); }
      else setStore("memory", "catalogue d'origine");
      mountKofi();                  /* aucun formulaire de connexion dans ce contexte */
    }).then(function(){
      if (!window.claude || !window.claude.use) return;
      window.claude.use("artifact").then(function(ns){
        if (ns && typeof ns.publish === "function"){
          store.writer = ns;
          if (store.mode !== "artifact") setStore("artifact", "stockage en ligne prêt");
        }
      });
      window.claude.use("downloads").then(function(ns){ store.downloads = ns; });
    });
  });
}
function normalize(j){
  return {
    v: 1,
    custom: Array.isArray(j.custom) ? j.custom : [],
    overrides: (j.overrides && typeof j.overrides === "object") ? j.overrides : {},
    gear: (j.gear && typeof j.gear === "object" && !Array.isArray(j.gear)) ? j.gear : {},
    hidden: Array.isArray(j.hidden) ? j.hidden : [],
    /* Les fiches supprimées y attendent quelques jours. Une fiche du catalogue
       n'y passe pas : la supprimer ne fait que la masquer, c'est déjà annulable. */
    trash: Array.isArray(j.trash) ? j.trash : [],
    lang: (j.lang === "en" || j.lang === "fr") ? j.lang : undefined,
    updated: j.updated || null
  };
}

var TRASH_DAYS = 30;
var TRASH_MAX = 50;

/** Retire de la corbeille ce qui a dépassé le délai, et borne sa taille. */
function pruneTrash(){
  if (!Array.isArray(S.trash)) S.trash = [];
  var limite = Date.now() - TRASH_DAYS * 86400000;
  S.trash = S.trash.filter(function(x){
    return x && x.preset && Date.parse(x.at || "") > limite;
  });
  if (S.trash.length > TRASH_MAX) S.trash = S.trash.slice(-TRASH_MAX);
}

/* ============================ rendu ============================ */
/* Tout contenu affiché passe ici : c'est donc le point de traduction. */
function esc(s){
  return String(t(s == null ? "" : s)).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function knob(angle, cls){ return '<span class="knob ' + (cls||"") + '" style="--a:' + angle + '"><i></i></span>'; }
function dial(label, value, angle, cls){
  return '<div class="dial">' + knob(angle, cls) +
         '<span class="dl">' + esc(label) + '</span><span class="dv">' + esc(value) + '</span></div>';
}

/* ---- lecture d'un réglage selon le type de commande ---- */
function ctrlValue(p, c){
  var v = getPath(p, c.k);
  if (v === undefined || v === null) return (c.d !== undefined ? c.d : null);
  return v;
}
function ctrlLabel(g, p, c){
  if (c.lAlt && p.mode && c.lAlt[p.mode]) return c.lAlt[p.mode];
  return c.l;
}
/** Une commande est-elle hors circuit dans le mode courant ? */
function ctrlOff(g, p, c){
  if (c.needs && !getPath(p, c.needs)) return true;
  if (g.modes && p.mode && g.modes.off && g.modes.off[p.mode]){
    return g.modes.off[p.mode].indexOf(c.k) >= 0;
  }
  return false;
}
function ctrlText(c, v){
  if (v === null) return "—";
  if (c.t === "clock") return hourLabel(v);
  if (c.t === "balance") return balLabel(v);
  if (c.t === "select") return t(selValue(c, v));
  if (c.t === "switch") return v ? "ON" : "OFF";
  if (c.t === "slider") return fmtDb(v);
  return numLabel(v, c.step);
}
/* Un curseur vertical : la position se lit à la hauteur du repère. */
function faderCell(label, value, c, v){
  var min = c.min === undefined ? -15 : c.min, max = c.max === undefined ? 15 : c.max;
  var t = Math.max(0, Math.min(1, (Number(v) - min) / (max - min)));
  return '<div class="dial"><span class="fdr"><i style="bottom:' + (t * 100).toFixed(1) + '%"></i></span>' +
    '<span class="dl">' + esc(label) + '</span><span class="dv">' + esc(value) + '</span></div>';
}
/** Retrouve la description d'une commande à partir de sa clé. */
function findCtrl(p, key){
  var g = gearOf(p), i;
  for (i=0;i<g.controls.length;i++) if (g.controls[i].k === key) return g.controls[i];
  return null;
}
function ctrlAngle(c, v){
  if (v === null) return "0deg";
  if (c.t === "clock") return hourAngle(v);
  var min = c.min === undefined ? 1 : c.min, max = c.max === undefined ? 10 : c.max;
  var t = (Number(v) - min) / (max - min);
  return (-150 + Math.max(0, Math.min(1, t)) * 300) + "deg";
}

/** Bandeau de cadrans d'un matériel, dans l'ordre de sa façade. */
function gearStrip(p){
  var g = gearOf(p), h = '<div class="strip ' + g.face + '">', i, c, v, off, cls;
  for (i=0;i<g.controls.length;i++){
    c = g.controls[i];
    /* Un sélecteur n'a pas d'aiguille : il se lit comme la balance, en étiquette. */
    if (c.t === "switch" || c.t === "balance" || c.t === "select") continue;
    v = ctrlValue(p, c);
    off = ctrlOff(g, p, c);
    if (c.t === "slider"){
      h += faderCell(ctrlLabel(g, p, c), off ? "—" : ctrlText(c, v), c, v);
      continue;
    }
    cls = g.face + (g.dim && p.mode === g.dim ? " cool" : "") +
          (g.hot && getPath(p, g.hot) ? " dr" : "") + (off ? " off" : "");
    h += dial(ctrlLabel(g, p, c), off ? "—" : ctrlText(c, v), off ? "0deg" : ctrlAngle(c, v), cls);
  }
  return h + "</div>";
}

/* ======================= dessin d'une pédale =======================
   Le boîtier est déduit de la description de la façade : les boutons se
   répartissent en rangées, les curseurs en peigne, et chaque repère est à
   la position réglée. Une pédale créée depuis l'interface est donc
   dessinée elle aussi, sans travail supplémentaire.                    */

function luma(hex){
  var t = String(hex || "#888888").replace("#", "");
  if (t.length === 3) t = t.charAt(0)+t.charAt(0)+t.charAt(1)+t.charAt(1)+t.charAt(2)+t.charAt(2);
  var r = parseInt(t.slice(0,2),16), g = parseInt(t.slice(2,4),16), b = parseInt(t.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}
function slotValue(vals, c){
  if (vals && vals[c.k] !== undefined && vals[c.k] !== null) return vals[c.k];
  return c.d !== undefined ? c.d : 5;
}

/* Silhouettes de boîtier. Ce sont des formats, pas des marques : chacune
   correspond à un gabarit courant du marché. `perRow` n'est qu'un défaut,
   la façade peut imposer le sien. */
var PEDAL_STYLES = {
  std:     {l:"Boîtier standard",   perRow:2, pad:14, foot:"round",   name:8,   minW:104},
  treadle: {l:"Compacte à bascule", perRow:3, pad:12, foot:"treadle", name:7.2, minW:112},
  tall:    {l:"Haute et étroite",   perRow:1, pad:12, foot:"round",   name:6.4, minW:74},
  big:     {l:"Grand boîtier",      perRow:3, pad:18, foot:"round",   name:10,  minW:130},
  mini:    {l:"Mini",               perRow:1, pad:9,  foot:"small",   name:5.8, minW:66}
};
function pedalStyle(g){ return PEDAL_STYLES[g && g.style] || PEDAL_STYLES.std; }

/** Combien de boutons par rangée : le choix de la façade, sinon celui du format. */
function knobsPerRow(g, count){
  var n = Number(g && g.perRow);
  if (n >= 1 && n <= 4) return Math.min(n, Math.max(1, count));
  var st = pedalStyle(g);
  return Math.min(st.perRow, Math.max(1, count));
}

/** SVG d'une pédale, réglages compris. */
function pedalArt(g, vals, opts){
  opts = opts || {};
  var knobs = [], sliders = [], switches = [], i, c;
  for (i=0;i<g.controls.length;i++){
    c = g.controls[i];
    if (c.t === "slider") sliders.push(c);
    else if (c.t === "switch") switches.push(c);
    else knobs.push(c);
  }

  var st = pedalStyle(g);
  var cols = knobsPerRow(g, knobs.length);
  var rows = Math.ceil(knobs.length / cols) || 0;
  var cellW = 40, cellH = 44, fadW = 16;

  var inner = Math.max(cols * cellW, sliders.length * fadW + 10, st.minW);
  var w = inner + st.pad * 2;
  var knobH = rows * cellH;
  var fadH = sliders.length ? 62 : 0;
  var swH = switches.length ? 16 : 0;
  var footH = st.foot === "treadle" ? 68 : (st.foot === "small" ? 40 : 58);
  var h = st.pad + knobH + fadH + swH + footH;
  if (h < w * 1.15) h = Math.round(w * 1.15);          /* un boîtier reste en portrait */

  var light = luma(g.color) > 0.6;
  var ink = light ? "#1A1A18" : "#F4F4F0";
  var sub = light ? "rgba(26,26,24,.6)" : "rgba(244,244,240,.6)";
  var off = opts.off === true;

  var out = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(g.model) + '">';
  out += '<rect x="2" y="2" width="' + (w-4) + '" height="' + (h-4) + '" rx="9" fill="' +
    esc(g.color || "#888888") + '" stroke="rgba(0,0,0,.55)" stroke-width="2"' +
    (off ? ' opacity=".5"' : '') + '/>';
  [[9,9],[w-9,9],[9,h-9],[w-9,h-9]].forEach(function(pt){
    out += '<circle cx="' + pt[0] + '" cy="' + pt[1] + '" r="2" fill="' + sub + '"/>';
  });

  /* boutons : chaque rangée est centrée, y compris la dernière si elle est incomplète */
  var y = st.pad + 18;
  for (i=0;i<knobs.length;i++){
    var row = Math.floor(i / cols);
    var inRow = Math.min(cols, knobs.length - row * cols);   /* boutons de cette rangée */
    var posInRow = i - row * cols;
    var cx = w / 2 + (posInRow - (inRow - 1) / 2) * cellW;
    var cy = y + row * cellH;
    var ang = parseFloat(ctrlAngle(knobs[i], slotValue(vals, knobs[i])));
    out += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy + '" r="12.5" fill="#F3F1EA" stroke="rgba(0,0,0,.45)"/>' +
      '<circle cx="' + cx.toFixed(1) + '" cy="' + cy + '" r="10" fill="#171613"/>' +
      '<line x1="' + cx.toFixed(1) + '" y1="' + (cy - 9) + '" x2="' + cx.toFixed(1) + '" y2="' + (cy - 3) +
      '" stroke="#F3F1EA" stroke-width="2" stroke-linecap="round" transform="rotate(' +
      ang.toFixed(1) + ' ' + cx.toFixed(1) + ' ' + cy + ')"/>' +
      '<text x="' + cx.toFixed(1) + '" y="' + (cy + 21) + '" fill="' + ink +
      '" font-size="6.2" text-anchor="middle" font-family="IBM Plex Mono, monospace">' +
      esc(String(knobs[i].l).toUpperCase()) + '</text>';
  }
  y += knobH;

  for (i=0;i<sliders.length;i++){
    var sx = w / 2 + (i - (sliders.length - 1) / 2) * fadW;
    var mn = sliders[i].min === undefined ? -15 : sliders[i].min;
    var mx = sliders[i].max === undefined ? 15 : sliders[i].max;
    var t = Math.max(0, Math.min(1, (Number(slotValue(vals, sliders[i])) - mn) / (mx - mn)));
    var tt = y + 6, th = 38;
    out += '<line x1="' + sx.toFixed(1) + '" y1="' + tt + '" x2="' + sx.toFixed(1) + '" y2="' + (tt + th) +
      '" stroke="rgba(0,0,0,.4)" stroke-width="2.5" stroke-linecap="round"/>' +
      '<rect x="' + (sx - 5).toFixed(1) + '" y="' + (tt + (1 - t) * th - 3).toFixed(1) +
      '" width="10" height="6" rx="1.6" fill="#171613" stroke="#F3F1EA" stroke-width=".8"/>' +
      '<text x="' + sx.toFixed(1) + '" y="' + (tt + th + 10) + '" fill="' + sub +
      '" font-size="5" text-anchor="middle" font-family="IBM Plex Mono, monospace">' +
      esc(sliders[i].l) + '</text>';
  }
  y += fadH;

  for (i=0;i<switches.length;i++){
    var wx = w / 2 + (i - (switches.length - 1) / 2) * 26 - 9;
    var on = !!(vals && vals[switches[i].k]);
    out += '<rect x="' + wx.toFixed(1) + '" y="' + y + '" width="18" height="9" rx="4.5" fill="' +
      (on ? "#171613" : "rgba(0,0,0,.22)") + '"/>' +
      '<circle cx="' + (wx + (on ? 13 : 5)).toFixed(1) + '" cy="' + (y + 4.5) +
      '" r="3.1" fill="#F3F1EA"/>';
  }
  y += swH;

  /* bas du boîtier : nom, témoin, commande au pied */
  var rest = h - y;
  if (st.foot === "treadle"){
    var bandY = y + Math.max(6, (rest - 60) / 2);
    out += '<line x1="8" y1="' + bandY + '" x2="' + (w-8) + '" y2="' + bandY +
      '" stroke="rgba(0,0,0,.3)"/>';
    out += '<text x="' + (w/2) + '" y="' + (bandY + 13) + '" fill="' + ink + '" font-size="' + st.name +
      '" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="700">' +
      esc(String(g.model).toUpperCase()) + '</text>';
    out += '<circle cx="' + (w - 14) + '" cy="' + (st.pad + 2) + '" r="3.2" fill="' +
      (off ? "rgba(0,0,0,.28)" : "#E24A3A") + '" stroke="rgba(0,0,0,.4)"/>';
    out += '<rect x="9" y="' + (bandY + 19) + '" width="' + (w - 18) + '" height="' + (h - bandY - 28) +
      '" rx="4" fill="rgba(0,0,0,.4)" stroke="rgba(0,0,0,.5)"/>' +
      '<rect x="14" y="' + (bandY + 24) + '" width="' + (w - 28) + '" height="' + (h - bandY - 38) +
      '" rx="3" fill="rgba(255,255,255,.07)"/>';
  } else {
    var fr = st.foot === "small" ? 8 : 11;
    var nameY = y + Math.max(12, (rest - fr * 2 - 16) / 2 + 6);
    if (st.foot !== "small"){
      out += '<text x="' + (w/2) + '" y="' + nameY + '" fill="' + ink + '" font-size="' + st.name +
        '" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="700">' +
        esc(String(g.model).toUpperCase()) + '</text>';
    }
    var ledY = st.foot === "small" ? y + 8 : nameY + 11;
    out += '<circle cx="' + (w/2) + '" cy="' + ledY + '" r="3.4" fill="' +
      (off ? "rgba(0,0,0,.28)" : "#E24A3A") + '" stroke="rgba(0,0,0,.4)"/>';
    out += '<circle cx="' + (w/2) + '" cy="' + (h - fr - 8) + '" r="' + fr +
      '" fill="#DCDCD6" stroke="rgba(0,0,0,.5)" stroke-width="1.6"/>' +
      '<circle cx="' + (w/2) + '" cy="' + (h - fr - 8) + '" r="' + (fr / 2) + '" fill="#B9B9B2"/>';
  }
  return out + '</svg>';
}
/** Un pédalier : les pédales côte à côte, dans l’ordre du signal. */
function boardArt(p){
  var slots = p.slots || [];
  if (!slots.length) return '<p class="hint">Pédalier vide — ajoute des pédales avec « Modifier ».</p>';
  var reg = allGear(), h = '<div class="art">', i, g;
  for (i=0;i<slots.length;i++){
    g = reg[slots[i].gear];
    if (!g) continue;
    if (i) h += '<span class="cable" aria-hidden="true">→</span>';
    h += '<div>' + pedalArt(g, slots[i].v || {}, {off: slots[i].on === false}) +
         '<p class="pdname">' + (i+1) + '. ' + esc(g.model) +
         (slots[i].on === false ? " · " + t("coupée") : "") + '</p></div>';
  }
  return h + '</div>';
}

/** Les valeurs d'une fiche de pédale, sous la forme attendue par le dessin. */
function pedalValues(p){
  var g = gearOf(p), out = {}, i, c;
  for (i=0;i<g.controls.length;i++){ c = g.controls[i]; out[c.k] = getPath(p, c.k); }
  return out;
}

/** Étiquettes : mode, balance, interrupteurs. */
function gearTags(p){
  var g = gearOf(p), out = [], i, c, v;
  if (g.modes && p.mode){
    out.push('<span class="tag ' + (p.mode === g.modes.options[0] ? "on" : "") + '">' +
             esc(cap(p.mode)) + '</span>');
  }
  for (i=0;i<g.controls.length;i++){
    c = g.controls[i];
    v = ctrlValue(p, c);
    if (c.t === "switch"){
      out.push('<span class="tag ' + (v ? "on" : "off") + '">' + esc(c.l) + '</span>');
    } else if (c.t === "balance"){
      out.push('<span class="tag">' + esc(c.l) + " " + esc(balLabel(v)) + '</span>');
    } else if (c.t === "select"){
      out.push('<span class="tag">' + esc(c.l) + " " + esc(t(selValue(c, v))) + '</span>');
    }
  }
  return out.length ? '<div class="tags">' + out.join("") + '</div>' : "";
}
function cap(s){ return String(s).charAt(0).toUpperCase() + String(s).slice(1); }
var NO_GAIN = ["Low Pass","High Pass","All Pass","Notch","Band Pass"];
function fmtDb(g){
  var n = Number(g);
  if (!isFinite(n)) return "à régler";
  return (n > 0 ? "+" : n < 0 ? "−" : "") + dec(Math.abs(n).toFixed(1)) + " dB";
}
function paramGrid(s){
  var def = pluginDef(s.plugin), out = [], i, d, v;
  for (i=0;i<def.params.length;i++){
    d = def.params[i];
    v = (s.p && s.p[d.k] !== undefined) ? s.p[d.k] : (d.d !== undefined ? d.d : null);
    out.push('<span class="pk">' + esc(d.l) + '</span><span class="pv">' + esc(fmtParam(d, v)) + '</span>');
  }
  return out.length ? '<div class="pgrid">' + out.join("") + '</div>' : "";
}
function bandTable(s){
  var rows = s.bands || [];
  if (!rows.length) return "";
  var h = '<div class="bwrap"><table class="bands"><thead><tr>' +
          '<th>#</th><th>Type</th><th>Fréquence</th><th>Gain</th><th>BW</th></tr></thead><tbody>';
  rows.forEach(function(b, i){
    h += '<tr' + (b.on === false ? ' class="bx"' : '') + '><td>' + (i+1) + '</td>' +
         '<td>' + esc(b.t) + '</td>' +
         '<td>' + esc(String(b.f).replace(".", ",")) + ' Hz</td>' +
         '<td>' + (NO_GAIN.indexOf(b.t) >= 0 ? "—" : esc(fmtDb(b.g))) + '</td>' +
         '<td>' + esc(String(b.bw).replace(".", ",")) + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}
function chainView(p){
  var rows = p.chain || [];
  if (!rows.length) return '<p class="hint">Chaîne vide — ajoute des plugins avec « Modifier ».</p>';
  var h = '<ol class="chain">';
  for (var i=0;i<rows.length;i++){
    var s = rows[i], off = s.on === false;
    h += '<li class="slot' + (off ? " bx" : "") + '">' +
      '<div class="slot-h"><span class="n">' + (i+1) + '</span><span class="p">' + esc(s.plugin) + '</span>' +
      (s.role ? '<span class="r">' + esc(s.role) + '</span>' : "") +
      (off ? '<span class="bp">hors circuit</span>' : "") + '</div>' +
      bandTable(s) + paramGrid(s) +
      (s.settings ? '<p class="sn">' + esc(s.settings) + '</p>' : "") +
      '</li>';
  }
  return h + '</ol>';
}

function card(p){
  var k = KINDS[p.kind] || KINDS.bass;
  var h = '<article class="card k-' + p.kind + '" data-id="' + esc(p.id) + '">';
  h += '<div class="card-h"><h3>' + esc(p.name) + '</h3><span class="kind ' + p.kind + '">' + esc(k.label) + '</span></div>';

  if (p.kind === "bass" || p.kind === "amp"){
    h += '<p class="gearname">' + esc(gearName(gearOf(p))) + '</p>';
    h += gearTags(p);
    h += gearStrip(p);
  } else if (p.kind === "pedal"){
    var pg = gearOf(p);
    h += '<div class="art">' + pedalArt(pg, pedalValues(p), {}) + '</div>';
    h += gearTags(p);
    h += gearStrip(p);
  } else if (p.kind === "board"){
    h += '<p class="gearname">' + (p.slots || []).length + ' ' +
         t("pédales dans l’ordre du signal") + '</p>';
    h += boardArt(p);
  } else {
    var meta = [];
    if (p.tempo) meta.push(p.tempo + " bpm");
    if (p.tuning) meta.push(p.tuning);
    if (meta.length) h += '<div class="tags"><span class="tag">' + esc(meta.join(" · ")) + '</span></div>';
    h += chainView(p);
  }

  if (p.song && (p.song.title || p.song.artist)){
    h += '<p class="song">♪ <b>' + esc(p.song.title || "—") + '</b>' + (p.song.artist ? " — " + esc(p.song.artist) : "") + '</p>';
  }
  if (p.notes) h += '<p class="note">' + esc(p.notes) + '</p>';
  var ex = (gearOf(p).extras || []), xi;
  for (xi=0; xi<ex.length; xi++){
    if (p[ex[xi].k]) h += '<p class="song"><b>' + esc(ex[xi].l) + '</b> · ' + esc(p[ex[xi].k]) + '</p>';
  }

  h += '<div class="card-f"><button class="btn small" data-act="edit">Modifier</button>' +
       '<button class="btn small ghost" data-act="dup">Dupliquer</button>' +
       '<button class="btn small ghost" data-act="exp"' +
       ' title="Écrit la fiche dans un fichier, façades comprises">Exporter</button>' +
       '<button class="btn small ghost" data-act="cmp"' +
       ' title="Met deux fiches côte à côte, écarts marqués">Comparer</button>' +
       (session.user && !session.isDemo
         ? '<button class="btn small ghost" data-act="share"' +
           ' title="La propose aux autres comptes de ce serveur">Partager</button>' : "") +
       (p.kind === "reaper" && window.RFX && (p.chain || []).length
         ? '<button class="btn small ghost" data-act="rfx"' +
           ' title="Écrit un fichier de chaîne pour Reaper">.RfxChain</button>' : "") +
       '<span class="spacer"></span>' +
       '<button class="btn small ghost" data-act="del">Supprimer</button></div>';
  return h + "</article>";
}

/* Le matériel d'une fiche, plus celui de chaque pédale d'un pédalier : filtrer
   sur une pédale doit ramener les pédaliers qui l'emploient. */
function gearsOf(p){
  if (p.kind === "board") return (p.slots || []).map(function(x){ return x.gear; });
  if (p.kind === "reaper") return [];
  return [gearId(p)];
}

/**
 * Les marques du matériel d'un preset. Un pédalier en a autant que de pédales,
 * et une chaîne Reaper aucune : ce sont des plugins, pas du matériel.
 */
function brandsOf(p){
  var reg = allGear(), vues = [];
  gearsOf(p).forEach(function(id){
    var g = reg[id];
    if (!g || !g.brand) return;
    if (vues.indexOf(g.brand) < 0) vues.push(g.brand);
  });
  return vues;
}

function passeKind(p){ return ui.kind === "all" || p.kind === ui.kind; }
function passeBrand(p){
  if (!ui.brands.length) return true;
  var b = brandsOf(p);
  return ui.brands.some(function(x){ return b.indexOf(x) >= 0; });
}
function passeGear(p){
  if (!ui.gear.length) return true;
  var g = gearsOf(p);
  return ui.gear.some(function(id){ return g.indexOf(id) >= 0; });
}
function passeTags(p){
  if (!ui.tags.length) return true;
  var t = p.tags || [];
  return ui.tags.some(function(x){ return t.indexOf(x) >= 0; });
}

/* Plusieurs choix dans une même facette : au moins un suffit. Entre facettes :
   tous doivent passer. C'est la convention attendue, et elle évite les
   sélections qui ne ramènent jamais rien. */
function matches(p){
  return passeKind(p) && passeBrand(p) && passeGear(p) && passeTags(p) && passeQ(p);
}

/** Minuscules et sans accents : « pedalier » doit trouver « pédalier ».
    Personne ne met les accents en tapant sur un téléphone, et une recherche
    qui ne trouve rien passe pour une recherche cassée. */
function plat(s){
  s = String(s == null ? "" : s).toLowerCase();
  try { s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  catch (e) { /* pas de normalize : les minuscules suffiront */ }
  /* Les ligatures ne se décomposent pas en NFD. */
  return s.replace(/\u0153/g, "oe").replace(/\u00e6/g, "ae");
}

function passeQ(p){
  if (!ui.q) return true;
  var hay = [p.name, p.notes, p.tech, p.strings, (p.tags||[]).join(" "),
             /* les deux langues, quelle que soit celle affichée */
             EN[p.name] || "", EN[p.notes] || "", EN[p.tech] || "",
             (p.tags||[]).map(function(x){ return EN[x] || ""; }).join(" "),
             (p.kind === "reaper" || p.kind === "board" ? "" : gearName(gearOf(p))),
             (p.slots||[]).map(function(x){ var g = allGear()[x.gear]; return g ? g.model : ""; }).join(" "),
             p.song ? (p.song.title + " " + p.song.artist) : "",
             (p.chain||[]).map(function(s){ return s.plugin + " " + s.role + " " + s.settings; }).join(" ")].join(" ");
  return plat(hay).indexOf(plat(ui.q)) >= 0;
}

/* ---------------- facettes ----------------
   Le compte d'une facette ignore la facette elle-même : sans cela, cocher un
   choix mettrait tous les autres à zéro et le filtre deviendrait un cul-de-sac. */
/**
 * Les marques présentes dans la vue. Une marque rassemble plusieurs modèles :
 * c'est le bon grain quand on cherche « tout ce que j'ai réglé sur du Ampeg »
 * sans se souvenir du modèle exact.
 */
function facetBrand(){
  var out = {};
  library().forEach(function(p){
    if (!passeKind(p) || !passeGear(p) || !passeTags(p) || !passeQ(p)) return;
    brandsOf(p).forEach(function(b){ out[b] = (out[b] || 0) + 1; });
  });
  return Object.keys(out).map(function(b){ return {id:b, n:out[b], l:b}; })
    .sort(function(a, b){
      /* « générique » en dernier : ce sont les gabarits, pas une marque. */
      if ((a.id === "générique") !== (b.id === "générique")) return a.id === "générique" ? 1 : -1;
      return b.n - a.n || a.l.localeCompare(b.l, "fr");
    });
}

function facetGear(){
  var out = {}, reg = allGear();
  library().forEach(function(p){
    if (!passeKind(p) || !passeBrand(p) || !passeTags(p) || !passeQ(p)) return;
    gearsOf(p).forEach(function(id){ if (reg[id]) out[id] = (out[id] || 0) + 1; });
  });
  return Object.keys(out).map(function(id){ return {id:id, n:out[id], l:gearName(reg[id])}; })
    .sort(function(a, b){ return b.n - a.n || a.l.localeCompare(b.l, "fr"); });
}

function facetTags(){
  var out = {};
  library().forEach(function(p){
    if (!passeKind(p) || !passeBrand(p) || !passeGear(p) || !passeQ(p)) return;
    (p.tags || []).forEach(function(t){ out[t] = (out[t] || 0) + 1; });
  });
  return Object.keys(out).map(function(t){ return {id:t, n:out[t], l:t}; })
    .sort(function(a, b){ return b.n - a.n || a.l.localeCompare(b.l, "fr"); });
}

function activeFilters(){ return ui.brands.length + ui.gear.length + ui.tags.length; }

function chip(type, x, on){
  return '<button class="chip" data-f' + type + '="' + esc(x.id) + '" aria-pressed="' + on + '">' +
         esc(x.l) + '<span class="n">' + x.n + '</span></button>';
}

function renderFilters(){
  var host = document.getElementById("filters");
  if (!host) return;
  var btn = document.getElementById("btn-filters");
  var actifs = activeFilters();
  if (btn){
    setHtml(btn, "Filtres" + (actifs ? " (" + actifs + ")" : ""));
    btn.setAttribute("aria-expanded", String(ui.open));
    btn.classList.toggle("on", actifs > 0);
  }
  host.hidden = !ui.open;
  if (!ui.open){ host.innerHTML = ""; return; }

  var mar = facetBrand(), mat = facetGear(), sty = facetTags(), h = "";
  /* La marque vient en premier : elle dégrossit, le modèle précise. Une seule
     marque dans la vue n'apprend rien à personne, donc on se tait. */
  if (mar.length > 1){
    h += '<div class="facet"><h3>Marque</h3><div class="chips">' +
         mar.map(function(x){ return chip("brand", x, ui.brands.indexOf(x.id) >= 0); }).join("") +
         '</div></div>';
  }
  if (mat.length){
    h += '<div class="facet"><h3>Matériel</h3><div class="chips">' +
         mat.map(function(x){ return chip("gear", x, ui.gear.indexOf(x.id) >= 0); }).join("") +
         '</div></div>';
  }
  if (sty.length){
    h += '<div class="facet"><h3>Styles</h3><div class="chips">' +
         sty.map(function(x){ return chip("tag", x, ui.tags.indexOf(x.id) >= 0); }).join("") +
         '</div></div>';
  }
  if (actifs) h += '<div class="facet"><button class="btn small ghost" data-fclear>Tout effacer</button></div>';
  if (!h) h = '<p class="hint">Rien à filtrer dans cette vue.</p>';
  host.innerHTML = tHtml(h);
}

/** Décrit la sélection en une ligne : pour l'en-tête d'impression. */
function filterLabel(){
  var reg = allGear(), bouts = [];
  if (ui.kind !== "all") bouts.push(t(KINDS[ui.kind].full));
  if (ui.brands.length) bouts.push(ui.brands.map(function(b){ return t(b); }).join(", "));
  if (ui.gear.length) bouts.push(ui.gear.map(function(id){ return reg[id] ? gearName(reg[id]) : id; }).join(", "));
  if (ui.tags.length) bouts.push(ui.tags.map(function(x){ return t(x); }).join(", "));
  if (ui.q) bouts.push("« " + ui.q + " »");
  return bouts.join(" · ");
}

function render(){
  var L = library(), shown = L.filter(matches);

  var counts = {all:L.length, bass:0, amp:0, reaper:0};
  L.forEach(function(p){ counts[p.kind] = (counts[p.kind] || 0) + 1; });
  var tabs = [["all","Tout"],["bass","Basse"],["amp","Ampli"],["pedal","Pédale"],
              ["board","Pédalier"],["reaper","Reaper"]];
  document.getElementById("tabs").innerHTML = tHtml(tabs.map(function(t){
    return '<button class="tab" role="tab" data-k="' + t[0] + '" aria-selected="' + (ui.kind === t[0]) + '">' +
           t[1] + '<span class="n">' + (counts[t[0]] || 0) + '</span></button>';
  }).join(""));

  renderFilters();

  var quoi = filterLabel();
  setHtml(document.getElementById("printhead"),
    '<h2>Presetbook</h2>' +
    '<p>' + (quoi ? esc(quoi) + " · " : "") + shown.length + ' ' +
    t(shown.length > 1 ? "fiches" : "fiche") + ' · ' + esc(printDate()) + '</p>');

  var host = document.getElementById("list");
  if (!shown.length){
    host.innerHTML = tHtml('<div class="empty">Aucun preset ne correspond.' +
      (activeFilters() ? ' Retire un filtre pour élargir.'
                       : ui.q ? ' Essaie un autre mot-clé.'
                              : ' Crée le premier avec « Nouveau preset ».') + '</div>');
    return;
  }

  var groups = [];
  if (ui.group === "song"){
    var by = {};
    shown.forEach(function(p){
      var key = (p.song && p.song.title) ? p.song.title + (p.song.artist ? " — " + p.song.artist : "") : "Sans morceau";
      (by[key] = by[key] || []).push(p);
    });
    Object.keys(by).sort(function(a,b){
      if (a === "Sans morceau") return 1;
      if (b === "Sans morceau") return -1;
      return a.localeCompare(b, "fr");
    }).forEach(function(k){ groups.push([k, by[k]]); });
  } else if (ui.group === "brand"){
    var byBrand = {}, ordre = [];
    shown.forEach(function(p){
      /* Un pédalier mêle les marques et une chaîne Reaper n'en a aucune : les
         ranger sous leur famille dit la vérité, les éclater n'en dirait pas. */
      var marques = (p.kind === "board" || p.kind === "reaper") ? [] : brandsOf(p);
      var key = marques.length ? marques.join(" + ") : KINDS[p.kind].full;
      if (!byBrand[key]){ byBrand[key] = []; ordre.push(key); }
      byBrand[key].push(p);
    });
    ordre.sort(function(a, b){
      return byBrand[b].length - byBrand[a].length || a.localeCompare(b, "fr");
    });
    ordre.forEach(function(k){ groups.push([k, byBrand[k]]); });
  } else {
    var byGear = {}, order = [];
    shown.forEach(function(p){
      var key = (p.kind === "reaper" || p.kind === "board") ? KINDS[p.kind].full : gearName(gearOf(p));
      if (!byGear[key]){ byGear[key] = []; order.push(key); }
      byGear[key].push(p);
    });
    order.sort(function(a, b){
      if (a === KINDS.reaper.full) return 1;
      if (b === KINDS.reaper.full) return -1;
      return byGear[b].length - byGear[a].length || a.localeCompare(b, "fr");
    });
    order.forEach(function(k){ groups.push([k, byGear[k]]); });
  }

  host.innerHTML = tHtml(groups.map(function(g){
    return '<section class="grp"><div class="grp-h"><h2>' + esc(g[0]) + '</h2>' +
           '<span class="c">' + g[1].length + '</span></div><div class="grid">' +
           g[1].map(card).join("") + '</div></section>';
  }).join(""));
}

/* Une option par type du plugin. Un type dont l'entier de fichier n'est pas
   établi reste visible mais non sélectionnable, sauf s'il est déjà en place. */
function eqTypeOptions(def, current){
  var known = window.RFX ? window.RFX.EQ_TYPE_IDS : {"Band":1,"Low Pass":1,"High Pass":1};
  var list = (def.bands && def.bands.types) || [];
  var out = "", i, nom, ok;                        /* pas « t » : c'est le nom de la fonction de traduction */
  for (i=0;i<list.length;i++){
    nom = list[i];
    ok = known[nom] !== undefined;
    out += '<option' + (nom === current ? " selected" : "") + (ok || nom === current ? "" : " disabled") +
           '>' + esc(nom) + (ok ? "" : " — " + t("à établir")) + '</option>';
  }
  if (current && list.indexOf(current) < 0){
    out = '<option selected>' + esc(current) + '</option>' + out;
  }
  return out;
}

/* ---- passerelle avec les chaînes d'effets de Reaper ---- */
function hasRfxOrigin(p){
  var rows = p.chain || [];
  for (var i=0;i<rows.length;i++) if (rows[i].rfx) return true;
  return false;
}
function importRfx(text){
  var parsed = window.RFX.parse(text);
  if (!parsed.fx.length){ toast("Aucun effet trouvé dans ce fichier."); return; }
  draft.chain = window.RFX.toChain(parsed);
  var connus = 0, i;
  for (i=0;i<draft.chain.length;i++) if (PLUGINS[draft.chain[i].plugin]) connus++;
  refreshBody();
  toast(tf("{0} effets importés, {1} reconnus en détail.", draft.chain.length, connus));
}
function exportRfx(p){
  p = p || draft;                                  /* depuis une carte, ou depuis l'éditeur */
  var text;
  try { text = window.RFX.fromChain(p.chain || []); }
  catch (err){ toast(tf("Export impossible — {0}", err.message)); return; }
  saveFile(fileName(p.name, ".RfxChain"), text, "text/plain",
           "Chaîne exportée : à déposer dans le dossier FXChains de Reaper.");
}

/* ==================== créer et modifier une façade ====================
   Les façades livrées ne sont pas modifiables : on les duplique. Celles
   créées ici vivent dans les données de l'utilisateur, comme ses fiches. */
var gdraft = null, gdraftId = null;

var CTRL_KINDS = [
  {t:"clock",   l:"Cadran cranté au milieu (lu en heures)"},
  {t:"scale",   l:"Échelle bornée (par exemple 1 à 10)"},
  {t:"balance", l:"Balance entre deux micros"},
  {t:"select",  l:"Sélecteur à positions nommées (micros, canaux…)"},
  {t:"switch",  l:"Interrupteur"},
  {t:"slider",  l:"Curseur vertical (bande d'égaliseur)"}
];

/**
 * Les positions d'un sélecteur, toujours sous forme de liste propre.
 *
 * La valeur enregistrée est le **nom** de la position, pas son rang : c'est ce
 * qui reste lisible dans un export, et ce qui survit à un réordonnancement des
 * positions. Le mode d'un matériel se stocke déjà comme ça.
 */
function selOpts(c){
  var l = c && c.opts;
  if (typeof l === "string") l = l.split(",");
  if (!Array.isArray(l)) return [];
  return l.map(function(x){ return String(x).trim(); }).filter(Boolean);
}

/** La position retenue, ou la première si ce qui est enregistré n'existe plus. */
function selValue(c, v){
  var l = selOpts(c);
  if (!l.length) return "";
  return l.indexOf(String(v)) >= 0 ? String(v) : (l.indexOf(String(c.d)) >= 0 ? String(c.d) : l[0]);
}
var FACES = [
  {f:"plain", l:"Neutre"},
  {f:"bass",  l:"Bouton noir, repère laiton"},
  {f:"amp",   l:"Bouton ivoire sur façade sombre"},
  {f:"laney", l:"Bouton blanc, repère bleu, panneau inox"}
];

function slugKey(label, taken){
  var base = String(label || "").toLowerCase()
    .replace(/[àâä]/g,"a").replace(/[éèêë]/g,"e").replace(/[îï]/g,"i")
    .replace(/[ôö]/g,"o").replace(/[ùûü]/g,"u").replace(/ç/g,"c")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  if (!base) base = "c";
  var key = "c." + base, i = 2;
  while (taken.indexOf(key) >= 0) key = "c." + base + "-" + (i++);
  return key;
}

  h += '</div><div class="chain-acts"><button class="btn small" data-cact="add">+ Commande</button></div>';
  if (!g.controls.length) h += '<p class="hint">Ajoute au moins une commande.</p>';
  h += '</fieldset>';
  return h;
}

function commitGear(){
  var g = gdraft;
  if (!g.model || !String(g.model).trim()){ toast("Donne un modèle à cette façade."); return; }
  if (!g.controls.length){ toast("Ajoute au moins une commande."); return; }
  var i;
  for (i=0;i<g.controls.length;i++){
    if (!g.controls[i].l){ toast(tf("La commande {0} n'a pas de libellé.", i+1)); return; }
    /* Un sélecteur à une position n'en est pas un, et à zéro il rend un menu
       vide : autant le dire avant d'enregistrer. */
    if (g.controls[i].t === "select" && selOpts(g.controls[i]).length < 2){
      toast(tf("Le sélecteur « {0} » a besoin d'au moins deux positions.", g.controls[i].l));
      return;
    }
  }
  S.gear = S.gear || {};
  S.gear[gdraftId] = clone(g);
  var neuve = gdraftId;
  gdraft = null;
  render();
  if (retourFiche){
    /* De retour dans la fiche, avec la façade qu'on vient de décrire déjà
       choisie : c'est ce qu'on voulait en partant. */
    var fiche = retourFiche.draft, frais = retourFiche.isNew;
    retourFiche = null;
    fiche.gear = neuve;
    applyGearDefaults(fiche);
    openEditor(fiche, frais);
  } else {
    openGearList();
  }
  save().then(function(ok){ if (ok) toast("Façade enregistrée."); });
}

function removeGear(id){
  var used = gearUsage(id);
  if (used){
    toast(tf(used > 1 ? "{0} fiches utilisent cette façade : change-les de matériel d'abord."
                        : "{0} fiche utilise cette façade : change-la de matériel d'abord.", used));
    return;
  }
  delete S.gear[id];
  render();
  openGearList();
  save().then(function(ok){ if (ok) toast("Façade supprimée."); });
}

/* Éditeur d'un matériel : entièrement déduit de sa description. */
function gearEditor(p){
  var g = gearOf(p), acc = p.kind === "bass" ? "var(--bass)" : "var(--amp)";
  var h = '<fieldset style="--acc:' + acc + '"><legend>Façade</legend>';

  h += '<label class="fld">Matériel<select data-gear>' +
    gearList(p.kind).map(function(x){
      return '<option value="' + esc(x.id) + '"' + (x.id === gearId(p) ? " selected" : "") + '>' +
             esc(gearName(x.g)) + '</option>';
    }).join("") + '</select></label>';
  /* Créer une façade était possible, mais seulement depuis l'écran Matériel :
     c'est-à-dire loin du moment où l'on s'aperçoit qu'elle manque. Dupliquer
     la façade affichée est le chemin le plus court — on part de la plus proche
     et on corrige ce qui diffère. */
  h += '<div class="acts" style="margin:-4px 0 10px">' +
    '<button class="btn small ghost" data-gdupid="' + esc(gearId(p)) + '">Dupliquer cette façade</button>' +
    '<button class="btn small ghost" data-gnewfrom="' + esc(p.kind) + '">Nouvelle façade</button>' +
    '</div>';
  if (g.note) h += '<p class="hint">' + esc(g.note) + '</p>';

  if (g.modes){
    h += '<div class="seg" data-seg="mode" role="tablist">' +
      g.modes.options.map(function(o){
        return '<button role="tab" data-v="' + esc(o) + '" aria-selected="' + (p.mode === o) + '">' +
               esc(cap(o)) + '</button>';
      }).join("") + '</div>';
  }

  var toggles = [], i, c, v, off;
  for (i=0;i<g.controls.length;i++){
    if (g.controls[i].t === "switch"){
      c = g.controls[i];
      toggles.push('<button class="tg" data-tg="' + esc(c.k) + '" aria-pressed="' +
                   !!getPath(p, c.k) + '">' + esc(c.l) + '</button>');
    }
  }
  if (toggles.length) h += '<div class="toggles">' + toggles.join("") + '</div>';

  for (i=0;i<g.controls.length;i++){
    c = g.controls[i];
    if (c.t === "switch") continue;
    v = ctrlValue(p, c);
    off = ctrlOff(g, p, c);
    if (c.t === "select"){
      /* Un curseur pour trois positions nommées serait un contresens : on choisit
         une position, on ne la dose pas. */
      h += '<label class="fld sel-c">' + esc(ctrlLabel(g, p, c)) +
        '<select data-sel="' + esc(c.k) + '"' + (off ? " disabled" : "") + '>' +
        selOpts(c).map(function(o){
          return '<option value="' + esc(o) + '"' + (selValue(c, v) === o ? " selected" : "") +
                 '>' + esc(o) + '</option>';
        }).join("") + '</select></label>';
      continue;
    }
    if (c.t === "clock"){
      h += sl(c.k, ctrlLabel(g, p, c), v, -5, 5, 0.25, off ? "hors circuit" : hourLabel(v), off);
    } else if (c.t === "balance"){
      h += sl(c.k, c.l + " " + (c.a || "1") + " ⇄ " + (c.b || "2"), v,
              c.min || 0, c.max || 100, c.step || 2, balLabel(v), off);
    } else {
      h += sl(c.k, c.l, v, c.min, c.max, c.step, ctrlText(c, v), off);
    }
  }
  h += '</fieldset>';

  var ex = g.extras || [];
  if (ex.length){
    h += '<div class="row">';
    for (i=0;i<ex.length;i++){
      h += '<label class="fld">' + esc(ex[i].l) +
           '<input type="text" data-f="' + esc(ex[i].k) + '" value="' + esc(p[ex[i].k] || "") + '"></label>';
    }
    h += '</div>';
  }
  return h;
}

/** Valeurs par défaut d'un matériel, sans toucher à ce qui existe déjà. */
function applyGearDefaults(p){
  var g = gearOf(p), i, c;
  if (g.modes && !p.mode) p.mode = g.modes.options[0];
  if (!g.modes) delete p.mode;
  for (i=0;i<g.controls.length;i++){
    c = g.controls[i];
    if (getPath(p, c.k) === undefined){
      /* Un sélecteur retombe sur sa première position, jamais sur zéro : sa
         valeur est un nom, et « 0 » n'en est pas un. */
      setPath(p, c.k, c.t === "switch" ? false
                    : c.t === "select" ? selValue(c, c.d)
                    : (c.d !== undefined ? c.d : 0));
    }
  }
  return p;
}

/* ============ éviter les doublons ============
   Une bibliothèque de plusieurs centaines de fiches finit par contenir deux
   « Motown doux » écrits à six mois d'intervalle. Le moment de s'en apercevoir
   est celui où l'on tape le nom, pas trois écrans plus loin. */

/** Sous deux caractères, tout ressemble à tout : on se tait. */
var SUGGEST_FROM = 2;
var SUGGEST_MAX = 5;

/**
 * Le nom commence-t-il par ce qu'on tape, au début d'un de ses mots ?
 *
 * Chercher la suite n'importe où ramenait « Jazz » et « Fuzz » dès qu'on tapait
 * « zz » : les deux premières lettres d'un nom neuf ratissaient toute la
 * bibliothèque. Un début de mot suffit à retrouver « Compression Motown » en
 * tapant « motown », sans le bruit.
 */
function debutDeMot(nom, q){
  var a = plat(nom), b = plat(q);
  if (!b) return false;
  if (a.indexOf(b) === 0) return true;
  return a.split(/[^a-z0-9]+/).some(function(mot){ return mot.indexOf(b) === 0; });
}

/** Les fiches dont le nom contient ce qu'on est en train de taper. */
function suggestName(q, saufId){
  if (plat(q).length < SUGGEST_FROM) return [];
  var aplati = plat(q);
  return library().filter(function(p){
    return p.id !== saufId && debutDeMot(p.name, q);
  }).sort(function(a, b){
    /* Le même nom exactement d'abord : c'est celui qui compte. */
    var ea = plat(a.name) === aplati, eb = plat(b.name) === aplati;
    if (ea !== eb) return ea ? -1 : 1;
    return plat(a.name).length - plat(b.name).length;
  }).slice(0, SUGGEST_MAX);
}

/** Les morceaux déjà saisis, sans répétition : un titre s'écrit d'une seule façon. */
function suggestSong(q){
  if (plat(q).length < SUGGEST_FROM) return [];
  var aplati = plat(q), vus = {}, out = [];
  library().forEach(function(p){
    if (!p.song || !p.song.title) return;
    var cle = plat(p.song.title) + "|" + plat(p.song.artist || "");
    if (vus[cle]) return;
    if (!debutDeMot(p.song.title, q)) return;
    vus[cle] = 1;
    out.push({title:p.song.title, artist:p.song.artist || ""});
  });
  return out.slice(0, SUGGEST_MAX);
}

/** Le bloc de propositions sous un champ. Rendu à part : la frappe ne
    reconstruit pas le formulaire, seulement cette zone-là. */
function renderSuggest(champ){
  /* Par identifiant plutôt que par attribut : il n'y a que deux zones, et un
     getElementById se laisse éprouver hors navigateur. */
  var host = document.getElementById(champ === "name" ? "sug-name" : "sug-song");
  if (!host || !draft) return;
  var val = champ === "name" ? draft.name : (draft.song ? draft.song.title : "");
  var h = "";

  if (champ === "name"){
    var vues = suggestName(val || "", isNew ? null : draft.id);
    if (vues.length){
      var exact = plat(vues[0].name) === plat(val);
      h += '<p class="t' + (exact ? " dup" : "") + '">' +
           (exact ? "Une fiche porte déjà ce nom :"
                  : "Des fiches proches existent déjà :") + '</p>';
      h += vues.map(function(p){
        return '<button type="button" data-sugopen="' + esc(p.id) + '">' + esc(p.name) +
               '<span class="k">' + esc(KINDS[p.kind].full) + '</span></button>';
      }).join("");
    }
  } else {
    var morceaux = suggestSong(val || "");
    if (morceaux.length){
      h += '<p class="t">Déjà saisi :</p>';
      h += morceaux.map(function(m){
        return '<button type="button" data-sugsong="' + esc(m.title) + '" data-sugart="' +
               esc(m.artist) + '">' + esc(m.title) +
               (m.artist ? '<span class="k">' + esc(m.artist) + '</span>' : "") + '</button>';
      }).join("");
    }
  }
  host.innerHTML = tHtml(h);
}

function getPath(o, path){
  var parts = path.split("."), cur = o;
  for (var i=0;i<parts.length;i++){ if (cur == null) return undefined; cur = cur[parts[i]]; }
  return cur;
}
function setPath(o, path, val){
  var parts = path.split("."), cur = o;
  for (var i=0;i<parts.length-1;i++){ if (cur[parts[i]] == null) cur[parts[i]] = {}; cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = val;
}

function commit(){
  if (!draft.name){ toast("Donne un nom au preset."); return; }
  var target = draft.id;
  if (isSeed(target)) S.overrides[target] = clone(draft);
  else {
    var k = -1;
    for (var i=0;i<S.custom.length;i++) if (S.custom[i].id === target) k = i;
    if (k >= 0) S.custom[k] = clone(draft); else S.custom.push(clone(draft));
  }
  closeEditor(); render();
  save().then(function(ok){ if (ok) toast("Preset enregistré."); });
}
function removePreset(id){
  var p = findPreset(id);
  if (isSeed(id)){
    /* Une fiche livrée n'est que masquée : « Réinitialiser » la ramène. */
    if (S.hidden.indexOf(id) < 0) S.hidden.push(id);
    delete S.overrides[id];
  } else {
    S.custom = S.custom.filter(function(x){ return x.id !== id; });
    if (p){
      pruneTrash();
      S.trash.push({at: new Date().toISOString(), preset: clone(p),
                    gear: gearsNeeded(p)});
    }
  }
  closeEditor(); render();
  save().then(function(ok){
    if (!ok) return;
    toast(tf("Fiche supprimée : {0}", p ? p.name : ""),
          isSeed(id) ? null : {label: "Annuler la suppression", run: function(){ restoreTrash(id); }});
  });
}

/** Les façades personnelles dont dépend une fiche : elles doivent revenir avec. */
function gearsNeeded(p){
  var ids = p.kind === "board" ? (p.slots || []).map(function(x){ return x.gear; })
                               : (p.gear ? [p.gear] : []);
  var out = {};
  ids.forEach(function(k){ if ((S.gear || {})[k]) out[k] = clone(S.gear[k]); });
  return out;
}

/** Ramène une fiche de la corbeille. */
function restoreTrash(id){
  pruneTrash();
  var i = -1, j;
  for (j = S.trash.length - 1; j >= 0; j--) if (S.trash[j].preset.id === id){ i = j; break; }
  if (i < 0){ toast("Cette fiche n'est plus dans la corbeille."); return; }
  var x = S.trash[i];
  S.trash.splice(i, 1);
  /* Les façades reviennent d'abord : sans elles la fiche serait illisible. */
  Object.keys(x.gear || {}).forEach(function(k){ if (!allGear()[k]) S.gear[k] = x.gear[k]; });
  if (findPreset(x.preset.id)){
    x.preset.id = "u-" + Date.now().toString(36) + "-" + Math.floor(Math.random()*1e4).toString(36);
  }
  S.custom.push(x.preset);
  render();
  save().then(function(ok){ if (ok) toast(tf("Fiche restaurée : {0}", x.preset.name)); });
}

function emptyTrash(){
  S.trash = [];
  render();
  save().then(function(ok){ if (ok) toast("Corbeille vidée."); });
}
function duplicate(id){
  var p = findPreset(id); if (!p) return;
  var c = clone(p);
  c.id = "u-" + Date.now().toString(36) + "-" + Math.floor(Math.random()*1e4).toString(36);
  c.name = tf("{0} (copie)", p.name);
  S.custom.push(c); render();
  save().then(function(ok){ if (ok) toast("Copie créée."); });
}

/* ============================ comparaison ============================
   « Qu'est-ce qui change entre mon réglage Motown et mon Jazz ? » est la
   question suivante d'un carnet de réglages. Y répondre en ouvrant deux cartes
   et en faisant l'aller-retour des yeux, c'est justement ce qu'un carnet
   devrait éviter.                                                            */

/**
 * Les lignes d'une comparaison : un libellé, les deux valeurs, et s'il y a
 * écart. Les valeurs sont lues et formatées **par les mêmes fonctions que les
 * cartes**, sinon la comparaison dirait autre chose que ce qu'on voit.
 */
function compareRows(a, b){
  var out = [];
  function ligne(l, va, vb, note){
    out.push({l:l, a:va, b:vb, diff: String(va) !== String(vb), note:note || ""});
  }

  if (a.kind !== b.kind) return out;          /* deux genres différents n'ont rien à confronter */

  var ga = gearOf(a), gb = gearOf(b);
  if (gearId(a) !== gearId(b)) ligne("Matériel", gearName(ga), gearName(gb));

  if (a.kind === "board"){
    /* Un pédalier se compare emplacement par emplacement : c'est l'ordre du
       signal qui fait le pédalier, pas seulement les réglages. */
    var sa = a.slots || [], sb = b.slots || [];
    var max = Math.max(sa.length, sb.length), i;
    for (i = 0; i < max; i++){
      out.push({l: String(i + 1) + ".",
                a: nomEmplacement(sa[i]), b: nomEmplacement(sb[i]),
                diff: nomEmplacement(sa[i]) !== nomEmplacement(sb[i]), note:""});
    }
    return out;
  }

  if (a.kind === "reaper"){
    if (a.tempo || b.tempo) ligne("Tempo", a.tempo || "—", b.tempo || "—");
    if (a.tuning || b.tuning) ligne("Accordage", a.tuning || "—", b.tuning || "—");
    var ca = a.chain || [], cb = b.chain || [];
    var m = Math.max(ca.length, cb.length), j;
    for (j = 0; j < m; j++){
      out.push({l: String(j + 1) + ".",
                a: nomMaillon(ca[j]), b: nomMaillon(cb[j]),
                diff: nomMaillon(ca[j]) !== nomMaillon(cb[j]), note:""});
    }
    return out;
  }

  /* Instrument, ampli, pédale : commande par commande, dans l'ordre de la
     façade. Si les deux façades diffèrent, on parcourt celle de la première et
     on signale ce que la seconde n'a pas. */
  if (ga.modes) ligne("Mode", a.mode || ga.modes.options[0], b.mode || gb.modes && gb.modes.options[0]);

  ga.controls.forEach(function(c){
    /* findCtrl() attend une fiche et retombe sur le matériel par défaut : lui
       passer une façade inventerait des commandes que l'autre n'a pas. */
    var d = ctrlOfGear(gb, c.k);
    var va = ctrlOff(ga, a, c) ? "—" : ctrlText(c, ctrlValue(a, c));
    var vb = !d ? "" : (ctrlOff(gb, b, d) ? "—" : ctrlText(d, ctrlValue(b, d)));
    out.push({l: ctrlLabel(ga, a, c), a: va, b: vb,
              diff: !!d && String(va) !== String(vb),
              note: d ? "" : "absente de l'autre façade"});
  });

  (ga.extras || []).forEach(function(x){
    if (a[x.k] || b[x.k]) ligne(x.l, a[x.k] || "—", b[x.k] || "—");
  });
  return out;
}

/** Une commande d'une façade donnée, par sa clé. Rien d'implicite. */
function ctrlOfGear(g, key){
  var i;
  for (i = 0; i < g.controls.length; i++) if (g.controls[i].k === key) return g.controls[i];
  return null;
}

function nomEmplacement(slot){
  if (!slot) return "—";
  var g = allGear()[slot.gear];
  return (g ? g.model : slot.gear) + (slot.on === false ? " (coupée)" : "");
}

function nomMaillon(m){
  if (!m) return "—";
  return m.plugin + (m.on === false ? " (hors circuit)" : "");
}

/* ============================ étagère partagée ============================
   Ce que quelqu'un publie est une copie figée, façades comprises. On la reprend
   chez soi par le même chemin qu'un fichier importé — donc avec les mêmes
   garde-fous : identifiant refait s'il est déjà pris, refus si une façade
   manque.                                                                    */

var compareA = null;

/** Ouvre la comparaison, la première fiche étant celle d'où l'on vient. */
function openCompare(id, autre){
  compareA = id;
  var a = findPreset(id);
  if (!a) return;
  var candidats = library().filter(function(p){ return p.kind === a.kind && p.id !== a.id; });
  var b = autre ? findPreset(autre) : candidats[0];

  var veil = document.getElementById("veil");
  veil.innerHTML = tHtml('<div class="sheet" role="dialog" aria-modal="true" aria-label="Comparer">' +
    '<div class="sheet-h"><h2>Comparer</h2>' +
      '<button class="btn small ghost" data-close>Fermer</button></div>' +
    '<div class="sheet-b">' +
      (candidats.length ?
        '<label class="fld">Avec' +
          '<select data-compare-b>' + candidats.map(function(p){
            return '<option value="' + esc(p.id) + '"' + (b && p.id === b.id ? " selected" : "") +
                   '>' + esc(p.name) + '</option>';
          }).join("") + '</select></label>' +
        compareTable(a, b)
        : '<p class="hint">Il faut une seconde fiche du même genre pour comparer.</p>') +
    '</div></div>');
  veil.classList.add("open");
}

function compareTable(a, b){
  if (!b) return "";
  var rows = compareRows(a, b);
  var ecarts = rows.filter(function(r){ return r.diff; }).length;
  return '<p class="hint">' + (ecarts ? ecarts + " " + t(ecarts > 1 ? "écarts" : "écart")
                                      : t("Réglages identiques.")) + '</p>' +
    '<table class="cmp"><thead><tr><th></th><th>' + esc(a.name) + '</th><th>' + esc(b.name) +
    '</th></tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr' + (r.diff ? ' class="d"' : "") + '><th>' + esc(r.l) + '</th>' +
        '<td>' + esc(r.a) + '</td><td>' + esc(r.b) +
        (r.note ? ' <span class="mini" style="opacity:.6">' + esc(r.note) + '</span>' : "") +
        '</td></tr>';
    }).join("") + '</tbody></table>';
}

var sharedCache = [];
var sharedQ = "";

/* Le champ n'apparaît qu'une fois l'étagère assez fournie : sous une poignée de
   fiches, il n'aiderait personne et occuperait la place. */
var SHARED_FILTER_FROM = 6;

/** Le champ de recherche a-t-il lieu d'être ? Séparé pour être éprouvable seul. */
function sharedFilterVisible(){
  return sharedCache.length >= SHARED_FILTER_FROM;
}

function loadShared(){
  var host = document.getElementById("shared-list");
  if (!host) return;
  fetchJson("api/shared").then(function(j){
    sharedCache = (j && j.items) || [];
    if (!sharedCache.length){
      setHtml(host, "Personne n'a encore publié de fiche. Sois le premier : « Partager » sur une carte.");
      return;
    }
    var filtre = document.getElementById("shared-filter");
    if (filtre){
      filtre.innerHTML = sharedFilterVisible()
        ? tHtml('<input type="search" data-shared-q placeholder="Chercher un nom, un auteur…"' +
                ' aria-label="Chercher dans les fiches partagées">')
        : "";
      var champ = filtre.querySelector && filtre.querySelector("[data-shared-q]");
      if (champ) champ.value = sharedQ;
    }
    renderShared();
  }, function(){
    setHtml(host, "Étagère indisponible.");
  });
}

/** Le même aplatissement que la recherche du catalogue : casse et accents ignorés. */
function sharedMatch(it){
  if (!sharedQ) return true;
  var foin = [it.name, it.by, KINDS[it.kind] ? KINDS[it.kind].label : it.kind].join(" ");
  return plat(foin).indexOf(plat(sharedQ)) >= 0;
}

function renderShared(){
  var host = document.getElementById("shared-list");
  if (!host) return;
  var vues = sharedCache.filter(sharedMatch);
  if (!vues.length){
    setHtml(host, "Aucune fiche partagée ne correspond.");
    return;
  }
  host.innerHTML = tHtml('<div class="ulist">' + vues.map(function(it){
      var mien = session.user && it.by === session.user.name;
      return '<div class="urow">' +
        '<span class="kind ' + esc(it.kind) + '">' + esc(KINDS[it.kind] ? KINDS[it.kind].label : it.kind) + '</span>' +
        '<span class="uname">' + esc(it.name) + '</span>' +
        '<span class="mini" style="opacity:.6">' + t("par") + " " + esc(it.by) + '</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn small" data-take="' + esc(it.id) + '">Reprendre chez moi</button>' +
        (mien || session.isAdmin ?
          '<button class="btn small ghost danger" data-unshare="' + esc(it.id) + '">Retirer</button>' : "") +
        '</div>';
    }).join("") + '</div>');
}

/** Reprendre : exactement le chemin d'un fichier importé, garde-fous compris. */
function takeShared(id){
  var it = sharedCache.filter(function(x){ return x.id === id; })[0];
  if (!it) return;
  addPreset({v:1, presetbook:"preset", preset: it.preset, gear: it.gear || {}});
}

function unshare(id){
  post("api/shared/delete", {id:id}).then(function(){
    toast("Fiche retirée de l'étagère.");
    loadShared();
  }, function(err){ toast(err.message); });
}

/** Publier une de ses fiches. L'enveloppe est celle de l'export. */
function sharePreset(id){
  var p = findPreset(id);
  if (!p) return;
  var env = JSON.parse(presetFile(p));
  post("api/shared", {preset: env.preset, gear: env.gear}).then(function(j){
    toast(j && j.replaced ? tf("Fiche republiée : {0}", p.name) : tf("Fiche partagée : {0}", p.name));
  }, function(err){ toast(err.message); });
}

/**
 * Les états d'avant, un par jour. Le serveur en garde une semaine.
 *
 * C'est le filet qui manquait : la corbeille rattrape une suppression, celui-ci
 * rattrape le reste — une restauration malheureuse, une modification en masse,
 * une erreur qu'on ne remarque que le lendemain.
 */
function loadVersions(){
  var host = document.getElementById("versions");
  if (!host || store.mode !== "api") return;      /* sans serveur, pas d'instantanés */
  fetchJson("api/presets/versions").then(function(j){
    var l = (j && j.versions) || [];
    if (!l.length){ setHtml(host, ""); return; }
    host.innerHTML = tHtml('<fieldset><legend>Versions précédentes</legend>' +
      '<p class="hint">Un état par jour, gardé une semaine. Revenir à l\'un d\'eux remplace ' +
      'ta bibliothèque — l\'état actuel est photographié avant, donc c\'est réversible.</p>' +
      '<div class="ulist">' + l.map(function(v){
        return '<div class="urow"><span class="uname">' + esc(v.date) + '</span>' +
          '<span class="mini" style="opacity:.6">' + v.presets + ' ' +
          t(v.presets > 1 ? "fiches" : "fiche") + '</span>' +
          '<span class="spacer"></span>' +
          '<button class="btn small" data-version="' + esc(v.date) + '">Revenir à cette version</button>' +
          '</div>';
      }).join("") + '</div></fieldset>');
  }, function(){ setHtml(host, ""); });
}

var versionArmee = null;
function restoreVersion(btn){
  var jour = btn.getAttribute("data-version");
  if (versionArmee !== jour){
    versionArmee = jour;
    setHtml(btn, "Confirmer ?");
    window.setTimeout(function(){
      if (btn.isConnected && versionArmee === jour){
        versionArmee = null; setHtml(btn, "Revenir à cette version");
      }
    }, 4000);
    return;
  }
  versionArmee = null;
  btn.disabled = true;
  post("api/presets/restore", {date: jour}).then(function(){
    window.location.reload();      /* la bibliothèque a changé sous nos pieds */
  }, function(err){
    btn.disabled = false;
    setHtml(btn, "Revenir à cette version");
    toast(err.message);
  });
}

/** Les fiches supprimées récemment, et de quoi les ramener. */
function trashBody(){
  pruneTrash();
  if (!S.trash.length) return "";
  return '<fieldset><legend>Corbeille</legend>' +
    '<p class="hint">Les fiches supprimées y restent ' + TRASH_DAYS + ' jours, puis disparaissent.</p>' +
    '<div class="ulist">' + S.trash.slice().reverse().map(function(x){
      return '<div class="urow">' +
        '<span class="kind ' + esc(x.preset.kind) + '">' +
          esc(KINDS[x.preset.kind] ? KINDS[x.preset.kind].label : x.preset.kind) + '</span>' +

        '<span class="spacer"></span>' +

        '</div>';
    }).join("") + '</div>' +

    '</fieldset>';

function doImport(){
  var ta = document.getElementById("io");
  var j;
  try { j = JSON.parse(ta.value); } catch (e) { toast("Ce bloc n'est pas un JSON valide."); return; }
  if (j && j.presetbook === "preset" && j.preset){ addPreset(j); return; }
  var src = j && j.mine ? j.mine : j;
  if (!src || typeof src !== "object"){ toast("Sauvegarde illisible."); return; }
  S = normalize(src);
  closeEditor(); render();
  save().then(function(ok){ if (ok) toast("Sauvegarde restaurée."); });
}
function doReset(){
  S = {v:1, custom:[], overrides:{}, gear:{}, hidden:[]};
  closeEditor(); render();
  save().then(function(ok){ if (ok) toast("Catalogue d'origine rétabli."); });
}
/* Écrit un fichier chez l'utilisateur. Les trois contextes d'exécution n'ont
   pas les mêmes moyens, donc tout passe par ici pour ne pas diverger. */
function saveFile(name, data, type, okMsg){
  if (store.downloads){                       /* page publiée : le visiteur confirme l'enregistrement */
    store.downloads.save({filename:name, data:data}).then(function(){ toast(okMsg); })
      .catch(function(err){
        var code = (err && err.code) || "unavailable";
        if (code !== "declined") toast(tf("Téléchargement refusé ({0}) — copie le bloc à la main.", code));
      });
    return;
  }
  if (window.claude){                         /* bac à sable sans la capacité : le lien serait inerte */
    toast("Téléchargement indisponible ici : copie le bloc à la main.");
    return;
  }
  try {                                       /* déploiement autonome : téléchargement classique */
    var url = URL.createObjectURL(new Blob([data], {type:type}));
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    window.setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast(okMsg);
  } catch (e){
    toast("Téléchargement impossible — copie le bloc à la main.");
  }
}

/* Un nom de fichier tiré du nom de la fiche, sans surprise pour le système. */
function fileName(base, suffix){
  var net = String(base || "presetbook").replace(/[^\p{L}\p{N}._-]+/gu, "-").replace(/^-+|-+$/g, "");
  return (net || "presetbook") + suffix;
}

function doDownload(){
  saveFile("presetbook-presets.json", document.getElementById("io").value,
           "application/json", "Fichier téléchargé.");
}

/* Une fiche seule, avec les façades qu'elle utilise si elles sont personnelles :
   sans elles, la fiche serait illisible sur l'autre poste. */
function presetFile(p){
  var need = {}, ids = [], i;
  if (p.kind === "board") (p.slots || []).forEach(function(x){ ids.push(x.gear); });
  else if (p.gear) ids.push(p.gear);
  for (i=0;i<ids.length;i++){
    var g = (S.gear || {})[ids[i]];             /* seules les façades créées ici voyagent */
    if (g) need[ids[i]] = g;
  }
  return JSON.stringify({v:1, presetbook:"preset", preset:p, gear:need}, null, 1);
}

function exportPreset(id){
  var p = findPreset(id); if (!p) return;
  saveFile(fileName(p.name, ".presetbook.json"), presetFile(p),
           "application/json", "Fiche exportée.");
}

/* Une fiche exportée revient ici. Elle s'ajoute — jamais elle n'écrase — et
   reçoit un nouvel identifiant si le sien est déjà pris. */
function addPreset(env){
  var p = clone(env.preset);
  if (!p || !p.kind || !KINDS[p.kind]){ toast("Ce fichier ne contient pas de fiche."); return; }
  var g = env.gear && typeof env.gear === "object" ? env.gear : {};
  Object.keys(g).forEach(function(k){ if (!allGear()[k]) S.gear[k] = g[k]; });
  if (findPreset(p.id)){
    p.id = "u-" + Date.now().toString(36) + "-" + Math.floor(Math.random()*1e4).toString(36);
    p.name = tf("{0} (importée)", p.name);
  }
  var manque = (p.kind === "board" ? (p.slots || []).map(function(x){ return x.gear; })
                                   : (p.gear ? [p.gear] : [])).filter(function(k){ return !allGear()[k]; });
  if (manque.length){ toast(tf("Façade absente : {0}", manque.join(", "))); return; }
  S.custom.push(p);
  closeEditor(); render();
  save().then(function(ok){ if (ok) toast(tf("Fiche importée : {0}", p.name)); });
}

var toastTimer = null;
/**
 * Un message éphémère, avec au besoin une action à portée de clic.
 *
 * « Annuler » ne vaut que s'il est là au moment où l'on se rend compte de son
 * erreur : le chercher dans un écran de réglages, personne ne le fait.
 */
function toast(msg, action){
  var el = document.getElementById("toast");
  el.innerHTML = "";
  /* Le message porte des noms de fiches, donc du texte que l'utilisateur a
     écrit : il passe par textContent, jamais par innerHTML. */
  var texte = document.createElement("span");
  texte.textContent = t(msg);
  el.appendChild(texte);
  if (action && action.run){
    var b = document.createElement("button");
    b.className = "btn small";
    b.textContent = t(action.label || "Annuler la suppression");
    b.addEventListener("click", function(){
      el.classList.remove("show");
      action.run();
    });
    el.appendChild(b);
  }
  el.classList.add("show");
  if (toastTimer) window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(function(){ el.classList.remove("show"); },
                                 action ? 8000 : 3600);   /* le temps de lire et de cliquer */
}

document.getElementById("tabs").addEventListener("click", function(e){

});
document.getElementById("grp").addEventListener("click", function(e){

/* Chaque frappe reconstruisait toute la liste. Mesuré : environ 2,4 Ko de HTML
   par carte, donc plus d'un mégaoctet pour une bibliothèque de cinq cents
   fiches — à chaque touche. Un délai court suffit à ne rendre qu'une fois par
   mot tapé, et 150 ms restent imperceptibles. */
var qTimer = null;
document.getElementById("q").addEventListener("input", function(){
  var v = this.value;
  if (qTimer) window.clearTimeout(qTimer);
  qTimer = window.setTimeout(function(){ qTimer = null; ui.q = v; render(); }, 150);
});

});

document.getElementById("btn-print").addEventListener("click", function(){
  try { window.print(); } catch (e) { toast("L'impression n'est pas disponible ici."); }

document.getElementById("filters").addEventListener("click", function(e){
  var t2 = e.target;
  if (t2.closest("[data-fclear]")){ ui.brands = []; ui.gear = []; ui.tags = []; render(); return; }
  var m2 = t2.closest("[data-fbrand]"), g = t2.closest("[data-fgear]"), x = t2.closest("[data-ftag]");
  var liste = m2 ? ui.brands : g ? ui.gear : x ? ui.tags : null;
  if (!liste) return;
  var val = (m2 || g || x).getAttribute(m2 ? "data-fbrand" : g ? "data-fgear" : "data-ftag");
  var i = liste.indexOf(val);
  if (i >= 0) liste.splice(i, 1); else liste.push(val);
  render();
});

document.getElementById("list").addEventListener("click", function(e){
  var btn = e.target.closest("[data-act]"); if (!btn) return;
  var id = btn.closest("[data-id]").getAttribute("data-id");
  var act = btn.getAttribute("data-act");
  if (act === "edit"){ var p = findPreset(id); if (p) openEditor(p, false); }
  else if (act === "dup") duplicate(id);
  else if (act === "rfx"){ var q = findPreset(id); if (q) exportRfx(q); }
  else if (act === "exp") exportPreset(id);
  else if (act === "share") sharePreset(id);
  else if (act === "cmp") openCompare(id, null);
  else if (act === "del"){
    if (btn.getAttribute("data-armed") === "1") removePreset(id);
    else {
      btn.setAttribute("data-armed", "1"); btn.textContent = "Confirmer ?"; btn.classList.add("danger");
      window.setTimeout(function(){
        if (btn.isConnected){ btn.removeAttribute("data-armed"); btn.textContent = "Supprimer"; btn.classList.remove("danger"); }
      }, 4000);
    }
  }
});

document.getElementById("veil").addEventListener("click", function(e){
  if (e.target === this){ closeEditor(); return; }
  var t = e.target;

  var udel = t.closest && t.closest("[data-udel]");
  if (udel){ adminDelete(udel); return; }
  var pris = t.closest && t.closest("[data-take]");
  if (pris){ takeShared(pris.getAttribute("data-take")); return; }
  var retire = t.closest && t.closest("[data-unshare]");
  if (retire){ unshare(retire.getAttribute("data-unshare")); return; }
  var dReq = t.closest && t.closest("[data-reqinv]");
  if (dReq){ inviteForRequest(dReq.getAttribute("data-reqinv"), dReq); return; }
  var xReq = t.closest && t.closest("[data-reqdel]");
  if (xReq){
    post("api/requests/delete", {id: xReq.getAttribute("data-reqdel")}).then(function(){
      var out = document.getElementById("req-out");
      if (out) out.innerHTML = "";
      loadRequests();
    }, function(err){ toast(err.message); });
    return;
  }
  var neuf = t.closest && t.closest("[data-newinvite]");
  if (neuf){ newInvite(neuf); return; }
  if (t.closest && t.closest("[data-copyinvite]")){ copyInvite(); return; }
  var revoc = t.closest && t.closest("[data-invdel]");
  if (revoc){
    post("api/invites/revoke", {id: revoc.getAttribute("data-invdel")}).then(function(){
      toast("Invitation révoquée."); loadInvites();
    }, function(err){ toast(err.message); });
    return;
  }

  if (t.closest("[data-close]")){ closeEditor(); return; }

  /* Depuis l'éditeur d'une fiche : on note où revenir avant de basculer. */
  var dupIci = t.closest("[data-gdupid]");
  if (dupIci && draft){
    retourFiche = {draft: draft, isNew: isNew};
    openGearEditor(null, null, dupIci.getAttribute("data-gdupid"));
    return;
  }
  var neufIci = t.closest("[data-gnewfrom]");
  if (neufIci && draft){
    retourFiche = {draft: draft, isNew: isNew};
    openGearEditor(null, neufIci.getAttribute("data-gnewfrom"), null);
    return;
  }
  var gnew = t.closest("[data-gnew]");
  if (gnew){ openGearEditor(null, gnew.getAttribute("data-gnew"), null); return; }
  var grow = t.closest("[data-gid]");
  if (grow){
    var gid = grow.getAttribute("data-gid");
    if (t.closest("[data-gedit]")){ openGearEditor(gid, null, null); return; }
    if (t.closest("[data-gdup]")){ openGearEditor(null, null, gid); return; }
    if (t.closest("[data-gdel]")){
      var db = t.closest("[data-gdel]");
      if (db.getAttribute("data-armed") === "1") removeGear(gid);
      else { db.setAttribute("data-armed", "1"); db.textContent = "Confirmer ?"; db.classList.add("danger"); }
      return;
    }
  }
  if (t.closest("[data-gsave]")){ commitGear(); return; }
  if (t.closest("[data-gback]")){ gdraft = null; retourFiche = null; openGearList(); return; }

  if (draft && draft.kind === "board"){
    var bact = t.closest("[data-bact]");
    if (bact){
      var act = bact.getAttribute("data-bact");
      draft.slots = draft.slots || [];
      if (act === "add"){
        var first = gearList("pedal")[0];
        draft.slots.push({gear: first ? first.id : "pd-od", on:true, role:"", v:{}});
      } else {
        var i = parseInt(bact.closest("[data-si]").getAttribute("data-si"), 10);
        if (act === "rm") draft.slots.splice(i, 1);
        else if (act === "up" && i > 0) draft.slots.splice(i-1, 0, draft.slots.splice(i,1)[0]);
        else if (act === "down" && i < draft.slots.length-1) draft.slots.splice(i+1, 0, draft.slots.splice(i,1)[0]);
      }
      refreshBody();
      return;
    }
  }

  if (gdraft){
    var cact = t.closest("[data-cact]");
    if (cact){
      var act = cact.getAttribute("data-cact");
      if (act === "add"){
        var keys = gdraft.controls.map(function(c){ return c.k; });
        gdraft.controls.push({k:slugKey("", keys), t:"scale", l:"", min:1, max:10, step:0.5, d:5.5});
      } else {
        var ci = parseInt(cact.closest("[data-ci]").getAttribute("data-ci"), 10);
        if (act === "rm") gdraft.controls.splice(ci, 1);
        else if (act === "up" && ci > 0) gdraft.controls.splice(ci-1, 0, gdraft.controls.splice(ci,1)[0]);
        else if (act === "down" && ci < gdraft.controls.length-1) gdraft.controls.splice(ci+1, 0, gdraft.controls.splice(ci,1)[0]);
      }
      refreshGearForm();
      return;
    }
  }
  var nk = t.closest("[data-newkind]");
  if (nk){ openEditor(blank(nk.getAttribute("data-newkind")), true); return; }
  if (t.closest("[data-save]")){ commit(); return; }
  if (t.closest("[data-del]")){
    var b = t.closest("[data-del]");
    if (armDelete) removePreset(draft.id);
    else { armDelete = true; b.textContent = "Confirmer la suppression"; }
    return;
  }
  if (t.closest("[data-copy]")){
    var ta = document.getElementById("io"); ta.select();
    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function(){ toast("Copié."); },
      function(){ toast("Copie refusée — sélectionne le bloc et fais Ctrl+C."); });
    else toast("Sélectionne le bloc et fais Ctrl+C.");
    return;
  }
  var version = t.closest("[data-version]");
  if (version){ restoreVersion(version); return; }
  var untrash = t.closest("[data-untrash]");
  if (untrash){ restoreTrash(untrash.getAttribute("data-untrash")); closeEditor(); return; }
  if (t.closest("[data-emptytrash]")){ emptyTrash(); closeEditor(); return; }
  if (t.closest("[data-dl]")){ doDownload(); return; }
  if (t.closest("[data-rfx-out]") && draft){ exportRfx(); return; }
  if (t.closest("[data-import]")){ doImport(); return; }
  if (t.closest("[data-reset]")){
    var r = t.closest("[data-reset]");
    if (r.getAttribute("data-armed") === "1") doReset();
    else { r.setAttribute("data-armed","1"); r.textContent = "Confirmer la réinitialisation"; }
    return;
  }

  if (!draft) return;

  var seg = t.closest("[data-seg] [data-v]");
  if (seg){ draft.mode = seg.getAttribute("data-v"); refreshBody(); return; }
  var tg = t.closest("[data-tg]");
  if (tg){
    var key = tg.getAttribute("data-tg");
    setPath(draft, key, !getPath(draft, key));
    refreshBody(); return;
  }
  var sb = t.closest("[data-slot]");
  if (sb){
    var act = sb.getAttribute("data-slot");
    draft.chain = draft.chain || [];
    if (act === "add") draft.chain.push(slot("Autre plugin", "", {}));
    else {
      var i = parseInt(sb.closest("[data-i]").getAttribute("data-i"), 10);
      var cur = draft.chain[i];
      if (act === "rm") draft.chain.splice(i, 1);
      else if (act === "up" && i > 0) draft.chain.splice(i-1, 0, draft.chain.splice(i,1)[0]);
      else if (act === "down" && i < draft.chain.length-1) draft.chain.splice(i+1, 0, draft.chain.splice(i,1)[0]);
      else if (act === "band-add"){
        var bd = pluginDef(cur.plugin).bands;
        cur.bands = cur.bands || [];
        if (bd) cur.bands.push(clone(bd.dflt));
      } else if (act === "band-rm"){
        var bi = parseInt(sb.closest("[data-bi]").getAttribute("data-bi"), 10);
        cur.bands.splice(bi, 1);
      }
    }
    refreshBody(); return;
  }
});
